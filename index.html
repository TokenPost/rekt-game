const Sound = {
  on: localStorage.getItem('rekt.sound') !== 'off',
  ctx: null,
  boot() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); if (this.ctx.state === 'suspended') this.ctx.resume() },
  toggle() { this.on = !this.on; localStorage.setItem('rekt.sound', this.on ? 'on' : 'off'); paintSound()
    if (this.on) { this.boot(); this.play('hit') } else if (typeof Voice !== 'undefined') Voice.stop() },
  tone(type, f0, f1, dur, vol, delay) {
    const c = this.ctx, t = c.currentTime + (delay || 0), o = c.createOscillator(), g = c.createGain()
    o.type = type; o.frequency.setValueAtTime(f0 * this.P, t)
    o.frequency.exponentialRampToValueAtTime(Math.max(f1 * this.P, 1), t + dur)
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur)
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur)
  },
  noise(dur, vol, freq, delay) {
    const c = this.ctx, t = c.currentTime + (delay || 0), len = Math.floor(c.sampleRate * dur)
    const buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0)
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len)
    const s = c.createBufferSource(); s.buffer = buf
    const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = freq
    const g = c.createGain(); g.gain.value = vol
    s.connect(bp).connect(g).connect(c.destination); s.start(t)
  },
  // cartoon "talking" blips, pitched per boss
  voice(base, syllables) {
    if (!this.on) return
    this.boot(); this.P = 1
    for (let i = 0; i < syllables; i++) {
      const f = base * rnd(.85, 1.25)
      this.tone('square', f, f * .8, .055, .045, i * .075)
    }
  },
  P: 1,                                  // pitch multiplier, applied inside tone()
  play(n, p) {
    if (!this.on) return
    this.boot()
    this.P = p || 1
    if (n === 'hit')        { this.tone('square', 560, 250, .07, .05); this.noise(.05, .05, 1800) }
    else if (n === 'crack') { this.tone('square', 1400, 300, .06, .09); this.noise(.09, .13, 2600) }
    else if (n === 'heavy') { this.tone('sine', 180, 45, .26, .22); this.noise(.14, .14, 500) }
    else if (n === 'bark')  { this.tone('sawtooth', 700, 380, .09, .12); this.tone('sawtooth', 620, 300, .1, .11, .13) }
    else if (n === 'splat') { this.noise(.22, .18, 380); this.tone('sine', 240, 70, .2, .1) }
    else if (n === 'whale') { this.tone('sawtooth', 320, 55, .7, .18); this.tone('sine', 90, 40, .8, .16) }
    else if (n === 'shield'){ this.noise(.4, .22, 2600); this.tone('square', 900, 120, .35, .09) }
    else if (n === 'ko')    { this.tone('sawtooth', 420, 38, .9, .2); this.noise(.5, .12, 300) }
    else if (n === 'block') { this.tone('triangle', 300, 200, .09, .06) }
    else if (n === 'thud')  { this.tone('sine', 120, 40, .18, .16); this.noise(.1, .08, 300) }
    else if (n === 'miss')  { this.tone('triangle', 200, 340, .1, .05) }
    else if (n === 'coins') {                       // combo payout: a bright jangle
      for (let i = 0; i < 9; i++) {
        const f = 1350 * (1 + i * .11) * rnd(.92, 1.09)
        this.tone('triangle', f, f * .55, .14, .042, i * .036)
      }
      this.tone('sine', 560, 300, .28, .05, .04)
    }
    else if (n === 'rain') { this.noise(1.6, .05, 2200); this.tone('sine', 90, 60, .5, .05) }
    else if (n === 'cashin') {                      // sweeping the floor into the purse
      for (let i = 0; i < 5; i++) this.tone('sine', 880 * (1 + i * .2), 660, .1, .032, i * .05)
    }
  },
}
function paintSound() { const t = Sound.on ? '🔊' : '🔇'; $('#sound').textContent = t; $('#sound2').textContent = t }

/* ================= PURE LOGIC (selfTest) ================= */
function calcDamage(base, mods) {
  let d = base
  if (mods.hodl) d *= .5
  if (mods.gasMax) d *= .7
  if (mods.crit) d *= 3
  if (mods.pegged) d *= .6
  if (mods.reboot) d *= 2
  return Math.max(1, Math.round(d))
}
function applyDamage(hp, shield, dmg) {
  if (shield > 0) { const a = Math.min(shield, dmg); return { shield: shield - a, hp, absorbed: true } }
  return { shield, hp: Math.max(0, hp - dmg), absorbed: false }
}
function damageStage(hp, max) {
  const p = hp / max
  return p > .8 ? 0 : p > .6 ? 1 : p > .35 ? 2 : p > .15 ? 3 : 4
}
function impulse(kick, lift, hitSide) { return { vx: -hitSide * kick, vy: -lift } }
// one spring-damper joint step with hard angle limits (partial ragdoll)
function stepJoint(j, dt) {
  const acc = -j.k * (j.a - j.rest) - j.d * j.v
  j.v += acc * dt
  j.a += j.v * dt
  if (j.a < j.min) { j.a = j.min; j.v = -j.v * .35 }
  else if (j.a > j.max) { j.a = j.max; j.v = -j.v * .35 }
  return j
}


/* ================= SAVE =================
   Coins and unlocks persist on the device. No account: there is nothing worth an
   account yet, and asking for one before there is a save to protect is pure friction.
   Client-side means the numbers are editable — acceptable while this is single player,
   and the reason there is no leaderboard. */
const FREE_WEAPONS = ['candle', 'bat', 'hammer', 'pizza']
const PRICES = { doge: 600, whale: 900 }
const STAGE_PRICES = { grocery: 1200 }
const Save = {
  coins: 0, owned: FREE_WEAPONS.slice(), stages: ['arena'], stage: 'arena',
  load() {
    try {
      const raw = JSON.parse(localStorage.getItem('rekt.save') || '{}')
      this.coins = Math.max(0, raw.coins | 0)
      const own = Array.isArray(raw.owned) ? raw.owned : []
      this.owned = [...new Set([...FREE_WEAPONS, ...own.filter(id => PRICES[id])])]
      const st = Array.isArray(raw.stages) ? raw.stages : []
      this.stages = [...new Set(['arena', ...st.filter(id => STAGE_PRICES[id])])]
      this.stage = this.stages.includes(raw.stage) ? raw.stage : 'arena'
    } catch (_) { /* corrupt save: start clean rather than crash into a blank screen */ }
  },
  save() {
    try {
      localStorage.setItem('rekt.save', JSON.stringify(
        { coins: this.coins, owned: this.owned, stages: this.stages, stage: this.stage }))
    } catch (_) {}
  },
  has(id) { return this.owned.includes(id) },
  hasStage(id) { return this.stages.includes(id) },
  buyStage(id) {
    const price = STAGE_PRICES[id]
    if (!price || this.hasStage(id) || this.coins < price) return false
    this.coins -= price; this.stages.push(id); this.stage = id; this.save(); return true
  },
  buy(id) {
    const price = PRICES[id]
    if (!price || this.has(id) || this.coins < price) return false
    this.coins -= price; this.owned.push(id); this.save(); return true
  },
}
Save.load()

function paintPurse() {
  const n = Save.coins
  const pu = $('#purse'); if (pu) pu.textContent = '🪙 ' + n
  const sb = $('#shopbtn b'); if (sb) sb.textContent = n
  const bal = $('#shopbal'); if (bal) bal.textContent = n
}
function stageName(id) { const th = THEMES[id]; return (th.name && th.name[lang]) || th.name.en }
function buildStages() {
  const bar = $('#stagebar'); if (!bar) return
  bar.innerHTML = ''
  Object.keys(THEMES).forEach(id => {
    const owned = Save.hasStage(id)
    const b = el('button', (Save.stage === id ? 'on ' : '') + (owned ? '' : 'locked'),
      stageName(id) + (owned ? '' : '  🔒 ' + STAGE_PRICES[id]))
    b.onclick = () => {
      if (!owned) { Sound.boot(); buildShop(); $('#shop').classList.add('on'); return }
      Save.stage = id; Save.save(); applyTheme(id); buildStages()
    }
    bar.appendChild(b)
  })
}
function buildShop() {
  $('#shoptitle').textContent = t('shop')
  $('#shopclose').textContent = t('close')
  const list = $('#shoplist'); list.innerHTML = ''
  Object.keys(STAGE_PRICES).forEach(id => {
    const owned = Save.hasStage(id), afford = Save.coins >= STAGE_PRICES[id]
    const th = THEMES[id]
    const row = el('div', 'row')
    row.innerHTML = `<div class="art" style="font-size:30px;display:grid;place-items:center">🏬</div>
      <div class="meta"><b>${stageName(id)}</b><span>${t('stages')} · ${owned ? t('owned') : '🪙 ' + STAGE_PRICES[id]}</span></div>`
    if (owned) row.appendChild(el('div', 'have', t('owned')))
    else {
      const b = el('button', 'buy', t('buy'))
      b.disabled = !afford
      b.onclick = () => { if (Save.buyStage(id)) { Sound.play('coins'); applyTheme(id); paintPurse(); buildShop(); buildStages() } }
      row.appendChild(b)
    }
    list.appendChild(row)
  })
  WEAPONS.filter(w => PRICES[w.id]).forEach(w => {
    const owned = Save.has(w.id), afford = Save.coins >= PRICES[w.id]
    const row = el('div', 'row')
    row.innerHTML = `<div class="art"></div>
      <div class="meta"><b>${wpName(w)}</b><span>${w.stars} · ${owned ? t('owned') : '🪙 ' + PRICES[w.id]}</span></div>`
    const art = row.querySelector('.art')
    const spec = AIM_ART[w.id]
    if (spec && spec !== 'pizza') {
      const [cls, n] = spec.split(':')
      art.appendChild(el('div', 'wpn ' + cls, '<i></i>'.repeat(+n)))
    }
    if (owned) row.appendChild(el('div', 'have', t('owned')))
    else {
      const b = el('button', 'buy', t('buy'))
      b.disabled = !afford
      b.onclick = () => { if (Save.buy(w.id)) { Sound.play('coins'); paintPurse(); buildShop(); buildWeapons() } }
      row.appendChild(b)
    }
    list.appendChild(row)
  })
  paintPurse()
}

/* ================= AIMED WEAPON =================
   Follows the pointer and rotates so the striking end points at the boss. Each piece
   of art is drawn with its business end downward, so the rotation is just the angle
   to the boss minus 90 degrees. */
const SWUNG = ['bat', 'hammer']    // these travel through an arc
const AIM_ART = {
  candle: 'w-candle:2', bat: 'w-bat:5', hammer: 'w-hammer:2',
  doge: 'w-doge:11', pizza: 'pizza', whale: 'w-whale:4',
}
function buildAim() {
  const a = $('#aim'); if (!a) return
  a.innerHTML = ''
  a.classList.toggle('throwable', !!W(G.weapon).splat)
  a.classList.toggle('arc', SWUNG.includes(G.weapon))
  const spec = AIM_ART[G.weapon]
  if (!spec) return
  if (spec === 'pizza') {
    const holder = el('div', 'wpn')
    const pz = pizzaNode('')
    pz.style.left = '0'; pz.style.top = '0'
    pz.style.setProperty('--pr', '0deg')
    holder.appendChild(pz)
    a.appendChild(holder)
    return
  }
  const [cls, n] = spec.split(':')
  if (SWUNG.includes(G.weapon)) a.appendChild(el('div', 'swoosh'))
  a.appendChild(el('div', 'wpn ' + cls, '<i></i>'.repeat(+n)))
}
function moveAim(clientX, clientY) {
  const a = $('#aim'); if (!a || G.over || !G.boss) return
  const x = clientX - AR.left, y = clientY - AR.top
  const ang = Math.atan2(bossCY() - y, bossCX() - x) * 180 / Math.PI - 90
  a.style.transform = `translate3d(${x.toFixed(1)}px,${y.toFixed(1)}px,0) rotate(${ang.toFixed(1)}deg)`
  a.classList.add('on')
}
function strikeAim(toss) {
  const a = $('#aim'); if (!a) return
  const cls = toss ? 'tossed' : 'hit'
  a.classList.remove('hit', 'tossed'); void a.offsetWidth; a.classList.add(cls)
  setTimeout(() => a.classList.remove(cls), toss ? 400 : 240)
}

/* ================= BACKGROUND PROPS =================
   Scenery the player can turn on the boss. Deliberately dealing zero damage: this is
   the humiliation axis, kept separate from the balance the fight length depends on.
   One tap arms a prop and it runs by itself for a few seconds — in a 45 second fight
   taps are a scarce resource, so anything that needs repeated tapping to stay useful
   would just be a damage loss and nobody would touch it. */
let propTimer = 0
function clearProps() {
  clearTimeout(propTimer); propTimer = 0
  const p = $('#props'); if (p) p.innerHTML = ''
}
function scheduleProp() {
  clearTimeout(propTimer)
  propTimer = setTimeout(() => { spawnProp(); scheduleProp() }, rnd(19000, 30000))
}
/* Grocery props sit on the shelves rather than drifting. Tap one and it flings a
   grocery at the boss: no damage, just a mess that sticks to him and then the floor. */
function flingAt(fromX, fromY, cls, color) {
  const f = el('div', 'fling ' + cls)
  f.style.left = fromX + 'px'; f.style.top = fromY + 'px'
  const tx = bossCX() + rnd(-30, 30), ty = bossCY() + rnd(-40, 40)
  f.style.setProperty('--fx', (tx - fromX).toFixed(0) + 'px')
  f.style.setProperty('--fy', (ty - fromY).toFixed(0) + 'px')
  f.style.setProperty('--ft', '.45s')
  $('#fx').appendChild(f)
  setTimeout(() => {
    f.remove()
    if (G.over || !bossEl) return
    spark(tx, ty, cls === 'egg' ? '🥚' : '🥒')
    shake('s'); Sound.play('splat')
    smearOn(tx, ty, color)
  }, 450)
}
function smearOn(ax, ay, color) {
  const lx = ax - (bossCX() - 100), ly = ay - (bossCY() - BODY_H / 2)
  const m = el('i', 'smear')
  const w = rnd(30, 52)
  m.style.setProperty('--sc', color)
  m.style.width = w.toFixed(0) + 'px'
  m.style.height = (w * .72).toFixed(0) + 'px'
  m.style.left = clamp(lx / 200 * 100, 10, 84) + '%'
  m.style.top = clamp(ly / BODY_H * 100, 8, 62) + '%'
  bossEl.querySelector('.marks').appendChild(m)
  setTimeout(() => m.classList.add('drip'), 450)
  setTimeout(() => {
    m.remove()
    const p = el('div', 'puddle')
    const pw = rnd(40, 70)
    p.style.width = pw.toFixed(0) + 'px'
    p.style.background = color
    p.style.left = (clamp(bossCX() + rnd(-40, 40), 30, AR.w - 30) - pw / 2).toFixed(0) + 'px'
    p.style.top = (AR.ground + rnd(0, 20)).toFixed(0) + 'px'
    $('#mess').appendChild(p)
    const all = $('#mess').querySelectorAll('.puddle')
    for (let i = 0; i < all.length - 8; i++) all[i].remove()
  }, 2700)
}
function spawnProp() {
  if (G.over || !theme.props || !theme.props.length) return
  if ($('#props').children.length >= 2) return       // never crowd the sky
  const kind = pick(theme.props)
  if (kind === 'eggbox' || kind === 'picklejar') return spawnShelfProp(kind)
  if (kind !== 'raincloud') return
  const p = el('div', 'prop raincloud')
  const w = 96, dist = AR.w + w + 40
  p.style.left = (-w - 20) + 'px'
  p.style.top = rnd(AR.h * .10, AR.h * .30).toFixed(0) + 'px'
  p.style.setProperty('--dur', rnd(17, 26).toFixed(1) + 's')
  p.style.setProperty('--dist', dist.toFixed(0) + 'px')
  p.style.setProperty('--shift', '0px')
  p.addEventListener('pointerdown', e => { e.stopPropagation(); burstRain(p) })
  p.addEventListener('animationend', () => p.remove())
  $('#props').appendChild(p)
}

function spawnShelfProp(kind) {
  const p = el('div', 'prop ' + kind, '<b></b><b></b><b></b>')
  const x = rnd(40, AR.w - 110), y = AR.h * (kind === 'eggbox' ? .30 : .52)
  p.style.left = x.toFixed(0) + 'px'
  p.style.top = y.toFixed(0) + 'px'
  p.style.animation = 'none'                       // shelf stock does not drift
  let left = kind === 'eggbox' ? 3 : 3
  p.addEventListener('pointerdown', e => {
    e.stopPropagation()
    if (left <= 0) return
    left--
    flingAt(x + 30, y + 16, kind === 'eggbox' ? 'egg' : 'pickle',
      kind === 'eggbox' ? '#f6e6a8cc' : '#7fb765cc')
    if (kind === 'eggbox') { const b = p.querySelector('b'); if (b) b.remove() }
    if (left <= 0) { p.style.opacity = '.35'; setTimeout(() => p.remove(), 2600) }
  })
  $('#props').appendChild(p)
  setTimeout(() => { if (p.isConnected && left > 0) p.remove() }, 22000)
}

function burstRain(cloud) {
  if (cloud.classList.contains('dark')) return
  cloud.classList.add('dark')
  Sound.play('rain')
  const fall = (AR.ground - parseFloat(cloud.style.top) - 46).toFixed(0) + 'px'
  for (let i = 0; i < 16; i++) {
    const d = el('i', 'drop')
    d.style.left = (8 + (i % 8) * 11).toFixed(0) + 'px'
    d.style.setProperty('--fall', fall)
    d.style.animationDelay = (i * 52 + rnd(0, 90)).toFixed(0) + 'ms'
    cloud.appendChild(d)
  }
  // soak him only while he is actually standing in it
  let ticks = 0
  const check = setInterval(() => {
    if (G.over || !cloud.isConnected) return stop()
    const cx = cloud.getBoundingClientRect().left - AR.left + 48
    if (Math.abs(cx - bossCX()) < 95) {
      bossEl.classList.add('wet')
      if (ticks % 3 === 0) puddle(bossCX() + rnd(-40, 40))
    }
    if (++ticks > 16) stop()
  }, 260)
  function stop() {
    clearInterval(check)
    cloud.querySelectorAll('.drop').forEach(d => d.remove())
    setTimeout(() => bossEl && bossEl.classList.remove('wet'), 1200)
  }
}
function puddle(x) {
  const m = $('#mess'), p = el('div', 'puddle')
  const w = rnd(40, 78)
  p.style.width = w.toFixed(0) + 'px'
  p.style.left = (clamp(x, 30, AR.w - 30) - w / 2).toFixed(0) + 'px'
  p.style.top = (AR.ground + rnd(0, 22)).toFixed(0) + 'px'
  m.appendChild(p)
  const all = m.querySelectorAll('.puddle')
  for (let i = 0; i < all.length - 8; i++) all[i].remove()
}

/* ================= SIGNATURE REACTIONS =================
   Spec calls for one reaction per boss that is theirs alone. Instead of hand-drawn
   clips, each one is a short pose written in joint angles: override the rest angles
   the springs are pulling toward, let the ragdoll settle into it, then release. */
const SIGNATURE = {
  ghost:       { t:1.2, say:'Still here.',  stiff:2.8, pose:{ torso:0, head:0, armL:8, armR:-8 }, cls:'sig-ghost' },
  architect:   { t:1.3, say:'Expensive.',   pose:{ head:-14, armR:28, foreR:-112 }, cls:'sig-think' },
  speedrunner: { t:.5,  say:'Too slow.',    kick:-140, cls:'sig-dash' },
  memelord:    { t:.9,  say:'Wow.',         hop:520, spin:380, cls:'sig-pop' },
  showman:     { t:1.0, say:'MY FACE!',     hop:780, spin:940, cls:'sig-fly' },
  algorithm:   { t:1.1, say:'Steady.',      pose:{ armL:76, armR:-76, foreL:40, foreR:-40, head:6 }, cls:'sig-shrug' },
  altruist:    { t:1.1, say:'Oops.',        pose:{ armL:92, armR:-92, foreL:30, foreR:-30, head:10 }, cls:'sig-panic' },
  rug:         { t:1.1, say:'MY BAG!',      pose:{ armL:-46, armR:46, foreL:70, foreR:-70 }, cls:'sig-hug' },
}
function restorePose() {
  const slack = G.over ? .18 : 1, sd = G.over ? .45 : 1
  for (const j of skel) {
    const b = BONES.find(x => x.n === j.n)
    j.rest = b.rest; j.k = b.k * slack; j.d = b.d * sd
  }
}
function signature(force) {
  if (G.over || !skel.length) return
  const now = performance.now()
  if (!force && now < G.sigAt) return
  G.sigAt = now + 2400
  const sg = SIGNATURE[G.boss.id]; if (!sg) return
  G.sigT = sg.t
  for (const j of skel) {
    if (sg.stiff) { j.k = j.base * sg.stiff; j.d = j.based * 1.7 }
    if (sg.pose && sg.pose[j.n] != null) j.rest = sg.pose[j.n]
  }
  if (sg.hop) G.vy -= sg.hop
  if (sg.spin) whip(Math.random() < .5 ? 1 : -1, sg.spin)
  if (sg.kick) G.vx += sg.kick
  if (sg.cls) { bossEl.classList.add(sg.cls); setTimeout(() => bossEl.classList.remove(sg.cls), sg.t * 1000) }
  if (sg.say) bubble(bossSig(G.boss))
}

/* ================= SKELETON RIG =================
   Bone list is shared by every boss; only lengths/widths differ per character.
   rest/min/max = joint constraints, k/d = spring-damper, sway = secondary-motion gain,
   hitW = how strongly a hit impulse whips that bone. */
const BONES = [
  { n:'torso', rest:0,   min:-34, max:34,  k:210, d:16,  sway:.35, hitW:.55 },
  { n:'head',  rest:0,   min:-46, max:46,  k:300, d:15,  sway:.9,  hitW:1.0 },
  { n:'armL',  rest:12,  min:-95, max:120, k:120, d:8.5, sway:1.7, hitW:1.5 },
  { n:'foreL', rest:8,   min:-25, max:135, k:150, d:8,   sway:1.4, hitW:1.3 },
  { n:'armR',  rest:-12, min:-120,max:95,  k:120, d:8.5, sway:1.7, hitW:1.5 },
  { n:'foreR', rest:-8,  min:-135,max:25,  k:150, d:8,   sway:1.4, hitW:1.3 },
  { n:'legL',  rest:-3,  min:-42, max:42,  k:260, d:18,  sway:.5,  hitW:.5 },
  { n:'shinL', rest:4,   min:-6,  max:80,  k:230, d:15,  sway:.6,  hitW:.6 },
  { n:'legR',  rest:3,   min:-42, max:42,  k:260, d:18,  sway:.5,  hitW:.5 },
  { n:'shinR', rest:-4,  min:-80, max:6,   k:230, d:15,  sway:.6,  hitW:.6 },
]

function figure(b) {
  const d = Object.assign({}, DEF, b)
  const f = el('div', 'boss' + (b.grin ? ' grin' : '') + (b.suit ? ' suit' : '') + (b.gaunt ? ' gaunt' : '') + (b.chub ? ' chub' : '') + (b.smirk ? ' smirk' : '') + (b.bare ? ' bare' : ''))
  const S = (k, v) => f.style.setProperty('--' + k, typeof v === 'number' ? v + 'px' : v)
  S('c', b.c); S('skin', d.skin); S('shirt', d.shirt); S('hair', d.hair); S('iris', d.iris)
  ;['hw','hh','hr','neckw','hairh','hairr','fringew','fringeh','eyey','eyex','eyew','eyeh','browlift','broww','browh',

    boss: b, max: b.hp, hp: b.hp, over: false, cd,

    tx: 0, moveT: 1.2, flee: 0, hitstop: 0, step: 0, bob: 0, talkAt: 0,

  })
  $('#select').hidden = true; $('#game').hidden = false
  $('#game').style.setProperty('--c', b.c)
  $('#bname').textContent = bossName(b); $('#bcoin').textContent = b.coin; $('#bmech').textContent = b.mech
  $('#callout').classList.remove('on')
  setTimeout(() => { if (!$('#game').hidden && G.boss === b) mechanic(b.mech, b.intro, bossIntro(b)) }, 420)
  $('#rekt').classList.remove('on')
  $('#gas').hidden = b.id !== 'architect'
  $('#peg').hidden = b.id !== 'algorithm'
  $('#peg').classList.remove('broke'); $('#hpbar').classList.remove('books')
  if (b.id === 'algorithm') paintPeg()
  $('#gas').classList.remove('max'); $('#gas .bar i').style.width = '0%'
  $('#combo').classList.remove('on')
  paintPurse()
  $('#fx').innerHTML = ''
  $('#mess').innerHTML = ''; clearTimeout(sweepTimer); sweepTimer = 0
  clearProps(); scheduleProp()
  setTimeout(() => { if (!$('#game').hidden && G.boss === b) spawnProp() }, 6000)
  cinema(false, false)
  clearCoins()
  document.querySelectorAll('.coin,#shieldfx').forEach(n => n.remove())

  const st = $('#stage'); st.innerHTML = ''
  puppet = el('div', 'puppet')
  bossEl = figure(b)
  bossEl.addEventListener('pointerdown', e => {
    e.stopPropagation()
    attack(e)                                   // grabbing still lands a hit: no wasted taps
    if (G.over || G.cine) return
    Object.assign(G.drag, { on:true, id:e.pointerId, tx:G.x, ty:G.y, vx:0, vy:0,
      ox: (e.clientX - AR.left) - bossCX(), oy: (e.clientY - AR.top) - bossCY() })
    try { bossEl.setPointerCapture(e.pointerId) } catch (_) {}   // keep tracking outside the body
    bossEl.classList.add('held')
  })
  bossEl.addEventListener('pointermove', e => {
    moveAim(e.clientX, e.clientY)
    if (!G.drag.on || e.pointerId !== G.drag.id) return
    G.drag.tx = (e.clientX - AR.left) - G.drag.ox - AR.w / 2
    G.drag.ty = (e.clientY - AR.top) - G.drag.oy - AR.ground + BODY_H / 2
  })
  const letGo = e => {
    if (!G.drag.on || (e && e.pointerId !== G.drag.id)) return
    G.drag.on = false
    bossEl.classList.remove('held')
    G.vx = clamp(G.drag.vx * THROW_GAIN, -THROW_MAX, THROW_MAX)
    G.vy = clamp(G.drag.vy * THROW_GAIN, -THROW_MAX, THROW_MAX)
    const speed = Math.hypot(G.vx, G.vy)
    if (speed > 260) {                           // a real throw, not a set-down
      whip(Math.sign(G.vx) || 1, Math.min(1100, speed * .5))
      G.flee = 0                                 // he is busy being airborne
      if (speed > 1400) { Sound.play('whale', 1.4); shake('m') } else Sound.play('hit', .7)
    }
  }
  bossEl.addEventListener('pointerup', letGo)
  bossEl.addEventListener('pointercancel', letGo)
  puppet.appendChild(bossEl); st.appendChild(puppet)
  skel = makeSkeleton(bossEl)
  measure(); paintHp(); render(); buildAim(); $('#aim').classList.remove('on')
  last = performance.now(); acc = 0
  requestAnimationFrame(loop)
}

function goldDrop(x, y, n, worth) {
  const mess = $('#mess')
  for (let i = 0; i < n; i++) {
    const fx = clamp(x + rnd(-95, 95), 22, AR.w - 22), fy = AR.ground + rnd(-6, 26)

    c.style.setProperty('--sy', (y - fy).toFixed(0) + 'px')
    c.style.setProperty('--r', rnd(-200, 200).toFixed(0) + 'deg')
    c.style.animationDelay = (i * 45) + 'ms'
    c.dataset.v = worth || 1
    mess.appendChild(c)
  }
  if (mess.querySelectorAll('.gold:not(.gone)').length > 26) sweepGold()
  else if (!sweepTimer) sweepTimer = setTimeout(sweepGold, 2400)
}
function sweepGold() {
  clearTimeout(sweepTimer); sweepTimer = 0
  const coins = [...$('#mess').querySelectorAll('.gold:not(.gone)')]
  if (!coins.length) return
  let total = 0
  coins.forEach((c, i) => {
    const fx = parseFloat(c.style.left), fy = parseFloat(c.style.top)
    c.style.setProperty('--gx', (30 - fx).toFixed(0) + 'px')
    c.style.setProperty('--gy', (22 - fy).toFixed(0) + 'px')
    c.style.animationDelay = (i * 22) + 'ms'
    c.classList.add('gone')
    total += +c.dataset.v || 1
    setTimeout(() => c.remove(), 700 + i * 22)
  })
  Sound.play('cashin')
  setTimeout(() => addPurse(total), 420)

/* ================= ATTACK ================= */
function attack(e) {
  if (G.over || G.cine) return
  const w = W(G.weapon), now = performance.now()
  // per-weapon cooldown AND a shared swing lock: without the lock a player can fire
  // every weapon in parallel and stack their cooldowns into ~2x the intended damage
  if (now < G.cd[w.id] || now < G.lock) return
  G.cd[w.id] = now + w.cd
  G.lock = now + Math.min(w.cd, SWING_LOCK)

  const x = e.clientX - AR.left, y = e.clientY - AR.top
  const b = G.boss
  if (b.id === 'architect') { G.gas = clamp(G.gas + 9, 0, 100); paintGas() }
  G.combo++; paintCombo()
  if (b.id === 'speedrunner' && !G.rebootShown && Math.random() < .04) reboot()

  const crit = Math.random() < 1 / 12
  const dmg = calcDamage(w.dmg, { hodl: G.hodl, gasMax: G.gasMax, reboot: G.reboot > 0, crit,
    pegged: G.peg > .5 && b.id === 'algorithm' })
  if (b.id === 'algorithm') { G.peg = clamp(G.peg - w.dmg * .0028, 0, 1); paintPeg() }
  const res = applyDamage(G.hp, G.shield, dmg)
  G.shield = res.shield; G.hp = res.hp

  if (w.swing) at(el('div', 'swing', w.swing), x, y)
  if (w.drop) at(el('div', 'drop', w.drop), x, y)
  if (w.fly) at(el('div', 'fly', w.fly), x, y)
  if (w.splat) { at(el('div', 'splat'), x, y); at(pizzaNode('thrown'), x, y); pizzaMess(e.clientX, e.clientY) }
  spark(x, y, w.spark)

  if (res.absorbed) {
    dmgNum(x, y, t('blocked'), 'blk'); Sound.play('block'); shake('s'); bits(x, y, 5, '#ff8e8e')
    if (G.shield <= 0) breakShield()
    return
  }

  const side = Math.sign((x - bossCX()) || 1)      // struck from the right -> flies left
  const imp = impulse(w.kick, w.lift, side)
  G.vx += imp.vx; G.vy += imp.vy
  whip(side, w.kick * .55)
  G.hitstop = w.hit === 'light' ? .015 : .075
  G.flee = w.hit === 'light' ? (Math.random() < .3 ? .8 : 0) : rnd(1.1, 1.9)

  strikeAim(!!w.splat)
  ouch(); addMark(e.clientX, e.clientY, w.hit !== 'light')
  dmgNum(x, y, dmg, crit ? 'crit' : w.id === 'whale' ? 'big' : '')
  bits(x, y, w.hit === 'light' ? 4 : 10)
  /* Pay for damage, not for taps. Paying per hit meant candle spam out-earned real
     weapons six to one, so the economy was telling players not to buy the very thing
     the shop sells. Combo is a modest multiplier now, not the main income. */
  const tier = Math.min(5, Math.floor(G.combo / 5))
  const value = Math.max(1, Math.round(dmg / COIN_PER_DMG * (1 + tier * .1)))
  const objs = clamp(Math.round(value / 3), 1, 6)   // value and coin count are separate
  goldDrop(x, y, objs, Math.max(1, Math.round(value / objs)))
  if (tier > G.comboTier) {                        // newly reached 5/10/15/20/25
    G.comboTier = tier
    goldDrop(bossCX(), bossCY(), 5, 3)
    banner('COMBO x' + G.combo + '   x' + (1 + tier * .1).toFixed(1), '#ffe066')
    Sound.play('coins')
  }
  // combo raises the pitch of every hit — cheapest escalation there is
  Sound.play(w.sfx, 1 + Math.min(G.combo, 22) * .028)
  if (crit) {
    at(el('div', 'critlabel', 'CRITICAL!'), x, y - 40)
    G.hitstop = Math.max(G.hitstop, .13); flash(); shake('l')
    G.vx *= 1.5; G.vy *= 1.4; whip(side, 700)
    Sound.play('crack', 1.5)
  }

  if (w.hit === 'light') shake('s')
  else if (w.hit === 'mid') { shake('m'); banner(w.shout, '#ffe066') }
  else { shake('l'); flash(); banner(w.shout, w.hit === 'launch' ? '#7ef29a' : '#ffe066') }
  // he speaks once every few hits, never twice on top of itself
  if (--G.talkIn <= 0) { G.talkIn = Math.round(rnd(4, 6)); talk(true, Math.random() < .4 ? painWord() : null) }
  if (w.id === 'whale') pop(el('div', 'whalefly', '🐋'))

  const heavyish = w.hit === 'heavy' || w.hit === 'launch'
  if (heavyish || crit || (w.hit === 'mid' && Math.random() < .35)) setTimeout(() => signature(), 280)

  paintHp(); paintDamageStage(); checkThresholds()
  if (G.hp <= 0) die()
}

/* ================= SIMULATION =================
   Fixed 120Hz steps with an accumulator: springs stay stable and motion
   does not stutter when a frame runs long. Rendering happens once per frame. */
const DT = 1 / 120
function physics(dt) {
  if (G.hitstop > 0) { G.hitstop -= dt; return }

  G.prevVx = G.vx
  const held = G.drag.on
  if (held) {
    // follow the pointer, and derive velocity from that motion so the throw on release
    // is whatever the hand was doing — smoothed, or one jittery frame decides the throw
    const L0 = lim()
    const nx = clamp(G.drag.tx, -L0, L0), ny = clamp(G.drag.ty, ceilY(), 0)
    G.drag.vx += ((nx - G.x) / dt - G.drag.vx) * .3
    G.drag.vy += ((ny - G.y) / dt - G.drag.vy) * .3
    G.vx = G.drag.vx; G.vy = G.drag.vy
    G.x = nx; G.y = ny
  } else {
    G.vy += 2600 * dt
    G.x += G.vx * dt
    G.y += G.vy * dt
  }

  // ceiling: keep his head inside the arena so a big throw never parks him off screen
  const CY = ceilY()
  if (G.y < CY) { G.y = CY; if (G.vy < 0) { G.vy = -G.vy * .35; whip(Math.sign(G.vx) || 1, 300) } }

  const airborne = held || G.y < -1
  if (held) { /* the hand holds him up */ }
  else if (airborne) G.vx *= Math.pow(.35, dt)
  else {
    G.y = 0
    if (G.vy > 320) {
      G.vy = -G.vy * .34; G.vx *= .6
      whip(Math.sign(G.vx) || 1, 260)
      dust(bossCX(), AR.ground + 6); Sound.play('thud'); shake('s')
    } else G.vy = 0
    G.vx *= Math.pow(.015, dt)
  }

  const L = lim()
  if (!held) {
    if (G.x > L) { G.x = L; G.vx = -Math.abs(G.vx) * .5; whip(1, 420) }
    if (G.x < -L) { G.x = -L; G.vx = Math.abs(G.vx) * .5; whip(-1, 420) }
  }

  // grounded locomotion — flee after a hit, otherwise wander, so aiming matters
  if (G.sigT > 0) { G.sigT -= dt; if (G.sigT <= 0) restorePose() }
  const settled = !airborne && Math.abs(G.vx) < 70
  if (!G.over && settled && !G.exitPrep && !held) {
    if (G.exit > 0) {                              // sprinting for the edge with the bag
      G.exit -= dt
      const dir = G.x >= 0 ? 1 : -1
      G.x += dir * 120 * dt          // 430 crossed the arena in 0.38s: invisible and unreactable
      G.step += dt * 18
      if (Math.abs(G.x) >= L - 3) rugEscaped()
      else if (G.exit <= 0) rugCaught()
    } else if (G.flee > 0) {
      G.flee -= dt
      bossEl.classList.add('scared')
      if (Math.abs(G.tx - G.x) < 30) G.tx = (G.x > 0 ? -1 : 1) * rnd(L * .4, L)
      G.x += Math.sign(G.tx - G.x) * G.walk * 2.6 * dt
      G.step += dt * 16
    } else {
      bossEl.classList.remove('scared')
      G.moveT -= dt
      if (Math.abs(G.tx - G.x) > 10) { G.x += Math.sign(G.tx - G.x) * G.walk * dt; G.step += dt * 7 }
      else if (G.moveT <= 0) { G.tx = rnd(-L, L); G.moveT = rnd(1.4, 3.2) }
    }
    G.x = clamp(G.x, -L, L)
    G.bob = -Math.abs(Math.sin(G.step)) * 5     // visual only — never touches physics y
  } else G.bob += (0 - G.bob) * Math.min(1, 10 * dt)

  // secondary motion: limbs lag behind the body's acceleration
  const ax = (G.vx - G.prevVx) / dt
  for (const j of skel) {
    j.v -= ax * j.sway * dt * .06
    if (airborne) j.v += (j.n.startsWith('arm') || j.n.startsWith('fore') ? -8 : 4) * dt
    stepJoint(j, dt)
  }
}
function render() {
  puppet.style.transform = `translate3d(${(G.x).toFixed(2)}px,${(G.y + G.bob).toFixed(2)}px,0)`
  for (const j of skel) j.el.style.transform = `rotate(${j.a.toFixed(2)}deg)`
  const air = clamp(-G.y / 260, 0, 1)
  const sh = bossEl.querySelector('.shadow')
  sh.style.transform = `scale(${(1 - air * .55).toFixed(3)})`
  sh.style.opacity = (1 - air * .6).toFixed(2)
  const s = $('#shieldfx')
  if (s) s.style.transform = `translate3d(${bossCX().toFixed(1)}px,${(bossCY() + 10).toFixed(1)}px,0)`
}
function loop(t) {
  if ($('#game').hidden) return
  let dt = (t - last) / 1000; last = t
  if (dt > .25) dt = .25                       // tab was backgrounded: don't explode
  acc += dt
  let steps = 0
  while (acc >= DT && steps < 8) { physics(DT); acc -= DT; steps++ }
  if (steps === 8) acc = 0

  if (!G.over) {
    const b = G.boss
    if (b.id === 'ghost') {
      G.hodlT -= dt
      if (G.hodlT <= 0) {
        G.hodl = !G.hodl; G.hodlT = G.hodl ? 3 : 6.5
        if (G.hodl) { banner('HODL!', '#f7931a'); talk(true); bossEl.style.filter = 'saturate(.55) brightness(.9)'
          mechanic('HODL MODE', 'He is guarding — your damage is halved until he drops it.'); signature(1) }
        else bossEl.style.filter = ''
      }
    }
    if (b.id === 'architect' && G.gas > 0) { G.gas = clamp(G.gas - 26 * dt, 0, 100); paintGas() }
    if (b.id === 'algorithm') {
      if (G.spiral) {                                  // bleeding out, but clawing the peg back up
        G.hp = Math.max(0, G.hp - 26 * dt)
        G.peg = clamp(G.peg + .055 * dt, 0, 1)
        paintHp(); paintDamageStage(); paintPeg()
        if (G.hp <= 0) die()
      } else if (G.peg < 1) { G.peg = clamp(G.peg + .02 * dt, 0, 1); paintPeg() }
    }
    if (b.id === 'speedrunner') {
      if (G.reboot > 0) {
        G.reboot -= dt; G.walk = 0; bossEl.style.filter = 'brightness(1.4) saturate(.4)'
        if (G.reboot <= 0) { G.walk = 235; bossEl.style.filter = '' }
      }
    }
  }
  render()
  requestAnimationFrame(loop)
}

/* ================= self-check: index.html#test ================= */
function selfTest() {
  const a = (c, m) => { if (!c) throw new Error('FAIL ' + m) }
  a(calcDamage(22, {}) === 22, 'base')
  a(calcDamage(22, { hodl: 1 }) === 11, 'hodl halves')
  a(calcDamage(20, { gasMax: 1 }) === 14, 'gas -30%')
  a(calcDamage(6, { hodl: 1, gasMax: 1 }) === 2, 'stacked')
  a(calcDamage(1, { hodl: 1 }) === 1, 'min 1')
  a(calcDamage(6, { reboot: 1 }) === 12, 'reboot doubles')
  a(calcDamage(20, { pegged: 1 }) === 12, 'holding peg soaks 40%')
  a(calcDamage(6, { crit: 1 }) === 18, 'crit triples')
  a(calcDamage(20, { crit: 1, pegged: 1 }) === 36, 'crit still soaked by the peg')
  let r = applyDamage(500, 180, 200); a(r.absorbed && r.shield === 0 && r.hp === 500, 'shield absorbs, no bleed-through')
  r = applyDamage(500, 0, 200); a(!r.absorbed && r.hp === 300, 'hp damage')
  r = applyDamage(50, 0, 200); a(r.hp === 0, 'hp floors at 0')
  a(damageStage(1000, 1000) === 0 && damageStage(700, 1000) === 1, 'stage early')
  a(damageStage(500, 1000) === 2 && damageStage(200, 1000) === 3 && damageStage(50, 1000) === 4, 'stage late')
  let k = impulse(500, 600, 1); a(k.vx === -500 && k.vy === -600, 'struck on the right -> flies left and up')
  k = impulse(500, 600, -1); a(k.vx === 500, 'struck on the left -> flies right')
  // joint: overshoot is clamped, and a released spring converges back to rest
  let j = { a: 0, v: 20000, rest: 0, k: 200, d: 12, min: -40, max: 40 }
  stepJoint(j, 1 / 120)
  a(j.a <= 40 && j.a >= -40, 'joint constraint holds')
  a(j.v < 0, 'clamped joint bounces back')
  j = { a: 30, v: 0, rest: 0, k: 200, d: 40, min: -90, max: 90 }
  for (let i = 0; i < 600; i++) stepJoint(j, 1 / 120)
  a(Math.abs(j.a) < 1, 'spring-damper settles to rest')
  a(BONES.length === 10 && BONES.every(b => b.min < b.max), 'rig sane')

  // voice picking, against a realistic desktop voice list (headless exposes none)
  if (typeof Voice !== 'undefined') {
    const mk = (name, lg, local) => ({ name, lang: lg, localService: local })
    const V = Object.create(Voice)
    V.list = [
      mk('Albert', 'en-US', true), mk('Bad News', 'en-US', true), mk('Bells', 'en-US', true),
      mk('Alex', 'en-US', true), mk('Samantha', 'en-US', true), mk('Daniel', 'en-GB', true),
      mk('Karen', 'en-AU', true), mk('Google US English', 'en-US', false),
      mk('Yuna', 'ko-KR', true), mk('Google 한국의', 'ko-KR', false),
    ]
    const en0 = V.pickVoice('en', 0), en1 = V.pickVoice('en', 1)
    a(en0 && en1, 'english resolves to a voice')
    a(!/albert|bad news|bells/i.test(en0.name + en1.name), 'novelty voices are skipped')
    a(en0.localService && en1.localService, 'offline-capable voices win over network ones')
    a(en0.name !== en1.name, 'different bosses get different voices')
    a(V.pickVoice('ko', 0).name === 'Yuna', 'korean picks the local voice, not the network one')
    a(V.pickVoice('ko', 5).name === 'Yuna', 'index wraps when a language has one voice')
    a(V.pickVoice('ja', 0) === null, 'unknown language yields no voice, so blips take over')
  }
  console.log('%cREKT self-check ok', 'color:#12b47a')
}
if (location.hash === '#test') selfTest()
</script>
