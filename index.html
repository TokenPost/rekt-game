<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>REKT — Beat the Crypto Bosses</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;background:#12103a;
  font-family:'Impact','Haettenschweiler','Arial Narrow Bold',system-ui,sans-serif;color:#fff;user-select:none}
#app{position:relative;height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* Impact carries no Hangul, so Korean falls back with broken metrics.
   Give every display-type element a real Korean face and drop the tracking.
   The REKT logo, the flavour banners and the mechanic titles stay Impact — they are
   Latin brand type in both languages. */
html[lang="ko"] .tag,html[lang="ko"] .hint,html[lang="ko"] .card .n,
html[lang="ko"] .bossline b,html[lang="ko"] #rekt .row button,
html[lang="ko"] .shout,html[lang="ko"] .dmg,html[lang="ko"] #combo{
  font-family:'Apple SD Gothic Neo','Pretendard','Malgun Gothic','Noto Sans KR',system-ui,sans-serif;
  font-weight:900}
html[lang="ko"] .tag,html[lang="ko"] .hint{letter-spacing:1px}
html[lang="ko"] .card .n{font-size:17px}
html[lang="ko"] .bossline b{font-size:18px}
html[lang="ko"] #rekt .row button{font-size:16px}

/* ============ BACKGROUND ============ */
.room{position:absolute;inset:0;overflow:hidden;
  background:linear-gradient(#5fd8ff 0%,#8ab6ff 34%,#c9a4ff 58%,#ffc7a1 78%,#ffb0c9 100%)}
.room .rays{position:absolute;left:50%;top:-30%;width:150%;height:120%;transform:translateX(-50%);opacity:.3;
  background:repeating-conic-gradient(from 0deg at 50% 50%,#fff9 0deg 7deg,transparent 7deg 20deg);
  animation:spin 44s linear infinite;will-change:transform}
@keyframes spin{to{transform:translateX(-50%) rotate(360deg)}}
.room .sun{position:absolute;right:-26px;top:6%;width:112px;height:112px;
  border-radius:50%;display:grid;place-items:center;font-size:66px;color:#fff;
  background:radial-gradient(circle at 36% 30%,#ffe680,#ffb521 62%,#ff8a00);
  box-shadow:0 0 0 9px #ffffff55,0 10px 0 #e07a00,0 0 60px #ffcf5f;
  text-shadow:0 4px 0 #cf7500;animation:bob 3.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-12px)}}
.room .cloud{position:absolute;font-size:56px;opacity:.95;animation:drift linear infinite;will-change:transform}
@keyframes drift{from{transform:translateX(-140px)}to{transform:translateX(560px)}}
.room .skyline{position:absolute;left:0;right:0;bottom:31%;height:30%;display:flex;align-items:flex-end;gap:8px;padding:0 6px}
.room .skyline i{flex:1;border-radius:6px 6px 0 0;background:#2ecc71;border:3px solid #1c2a4a;border-bottom:0;
  box-shadow:inset -7px 0 0 #00000022,inset 0 8px 0 #ffffff33}
.room .skyline i.d{background:#ff5d6c}
.room .floaty{position:absolute;font-size:30px;animation:float linear infinite;will-change:transform}
@keyframes float{from{transform:translateY(40px) rotate(0)}to{transform:translateY(-460px) rotate(320deg)}}
.room .floor{position:absolute;left:-4%;right:-4%;bottom:0;height:31%;
  background:linear-gradient(#59d26b,#2ea457 42%,#1d7b42);border-top:6px solid #1c2a4a;
  box-shadow:inset 0 12px 0 #ffffff2e}
.room .floor::before{content:'';position:absolute;inset:0;opacity:.22;
  background:repeating-linear-gradient(90deg,#0000 0 26px,#0b3d24 26px 52px)}
.room .mat{position:absolute;left:50%;bottom:16%;width:74%;height:9%;transform:translateX(-50%);
  border-radius:50%;background:radial-gradient(closest-side,#ffe066,#ffb521);
  border:5px solid #1c2a4a;box-shadow:0 6px 0 #00000022}
.room .banner{position:absolute;left:50%;bottom:31%;transform:translateX(-50%) translateY(50%);z-index:1;
  padding:5px 16px;border-radius:999px;background:#1c2a4a;color:#ffe066;font-size:13px;letter-spacing:3px;
  border:3px solid #fff;white-space:nowrap;box-shadow:0 5px 0 #00000033}

/* ============ SELECT ============ */
#select{position:relative;height:100%;display:flex;flex-direction:column;
  padding:18px 16px calc(14px + env(safe-area-inset-bottom))}
#topbar{position:absolute;top:14px;right:16px;z-index:6;display:flex;gap:8px}
.icobtn{width:40px;height:40px;border-radius:12px;border:3px solid #1c2a4a;background:#fff;color:#1c2a4a;
  font-size:17px;display:grid;place-items:center;box-shadow:0 4px 0 #1c2a4a55}
.icobtn:active{transform:translateY(3px);box-shadow:none}
.wrap{position:relative;z-index:2;display:flex;flex-direction:column;flex:1;min-height:0}
.logo{text-align:center;margin:6px 0 0;font-size:74px;line-height:.92;letter-spacing:2px;color:#ff3b4e;
  -webkit-text-stroke:7px #241a4d;paint-order:stroke fill;transform:skewX(-6deg);filter:drop-shadow(0 7px 0 #241a4d)}
.tag{text-align:center;font-family:system-ui;font-weight:800;font-size:11px;letter-spacing:4px;color:#fff;
  text-shadow:0 2px 0 #241a4d;margin:9px 0 14px}
/* cards carry overflow:hidden, which lets a grid row squash them to nothing on short
   screens — pin the rows to their content and let the roster scroll instead */
.stagebar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:11px}
.stagebar button{border:3px solid #241a4d;border-radius:999px;padding:6px 14px;font-size:14px;
  letter-spacing:1px;background:#ffffffdd;color:#241a4d;box-shadow:0 4px 0 #241a4d44}
.stagebar button.on{background:#ffd75e;box-shadow:0 4px 0 #241a4d}
.stagebar button.locked{background:#ffffff88;color:#6a739a}
.roster{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:11px;
  align-content:start;grid-auto-rows:max-content;overflow:auto;padding-bottom:6px}
.card{position:relative;border:4px solid #241a4d;border-radius:18px;padding:8px 8px 10px;text-align:center;
  background:linear-gradient(#ffffff,#e8eeff);color:#241a4d;overflow:hidden;box-shadow:0 6px 0 #241a4d55;transition:transform .08s}
.card:active{transform:translateY(4px);box-shadow:0 2px 0 #241a4d55}
.roster .card:last-child:nth-child(odd){grid-column:1/-1}
.card .prev{height:112px;position:relative;overflow:hidden}
.card .prev .boss{position:absolute;left:50%;top:50%;transform:translate(-50%,-46%) scale(.3)}
.card .n{font-size:19px;letter-spacing:1px;line-height:1.05}
.card .c{font-family:system-ui;font-weight:800;font-size:9px;letter-spacing:2px;color:var(--c);margin-top:1px}
.card .m{font-family:system-ui;font-weight:700;font-size:8.5px;letter-spacing:1px;color:#fff;margin-top:6px;
  background:#241a4d;border-radius:999px;padding:3px 6px}
.hint{text-align:center;font-family:system-ui;font-weight:800;font-size:10px;letter-spacing:3px;color:#fff;
  text-shadow:0 2px 0 #241a4d;padding-top:8px}


/* ================= SHOP ================= */
#shopbtn{position:absolute;top:14px;left:16px;z-index:6;display:flex;align-items:center;gap:6px;
  height:40px;padding:0 14px;border-radius:12px;border:3px solid #1c2a4a;background:#fff;color:#1c2a4a;
  font-size:17px;box-shadow:0 4px 0 #1c2a4a55}
#shopbtn:active{transform:translateY(3px);box-shadow:none}
#shopbtn b{font-family:system-ui;font-weight:900;font-size:14px}
#shop{position:absolute;inset:0;z-index:9;display:none;place-items:center;background:#241a4dcc;padding:18px}
#shop.on{display:grid}
#shop .panel{width:100%;max-width:400px;max-height:100%;overflow:auto;background:linear-gradient(#fff,#e8eeff);
  border:4px solid #241a4d;border-radius:20px;box-shadow:0 8px 0 #241a4d66;padding:16px;color:#241a4d}
#shop h3{text-align:center;font-size:30px;letter-spacing:2px;margin-bottom:2px}
#shop .bal{text-align:center;font-family:system-ui;font-weight:800;font-size:13px;margin-bottom:12px}
#shop .row{display:flex;align-items:center;gap:11px;border:3px solid #241a4d;border-radius:14px;
  background:#fff;padding:9px 11px;margin-bottom:9px}
#shop .art{position:relative;width:56px;height:64px;flex:0 0 56px}
#shop .art .wpn{left:50%;top:50%;transform:translate(-50%,-50%) scale(.42)}
#shop .meta{flex:1;min-width:0}
#shop .meta b{display:block;font-size:17px;letter-spacing:.5px}
#shop .meta span{display:block;font-family:system-ui;font-weight:700;font-size:10px;color:#5b6486}
#shop button.buy{border:3px solid #241a4d;border-radius:11px;padding:8px 13px;font-size:15px;
  background:#ffd75e;box-shadow:0 4px 0 #241a4d}
#shop button.buy:active{transform:translateY(3px);box-shadow:0 1px 0 #241a4d}
#shop button.buy[disabled]{background:#d8dcf0;color:#8b93b5;box-shadow:0 4px 0 #241a4d33}
#shop .have{font-family:system-ui;font-weight:900;font-size:11px;color:#12a06e;letter-spacing:1px}
#shop .close{display:block;width:100%;margin-top:6px;border:3px solid #241a4d;border-radius:13px;
  padding:11px;font-size:18px;background:#fff;box-shadow:0 5px 0 #241a4d}


/* ================= STAGE: GROCERY ================= */
.room.grocery{background:linear-gradient(#f3f6ff 0%,#e3e9f7 46%,#cfd8ee 100%)}
.grocery .ceil{position:absolute;left:0;right:0;top:0;height:9%;background:linear-gradient(#dfe5f5,#c9d2e8);
  border-bottom:5px solid #241a4d;display:flex;justify-content:space-around;align-items:center}
.grocery .ceil i{width:64px;height:12px;border-radius:6px;background:#fff8c9;
  border:3px solid #241a4d;box-shadow:0 0 22px #fff2a0}
.grocery .shelf{position:absolute;left:0;right:0;height:15%;border-top:5px solid #241a4d;
  background:linear-gradient(#c99a63,#9a6f3c);display:flex;align-items:flex-end;gap:7px;padding:0 10px 5px}
.grocery .shelf i{flex:1;border-radius:4px;border:3px solid #241a4d}
.grocery .aisle{position:absolute;left:6%;bottom:31%;width:88%;height:26%;
  border:5px solid #241a4d;border-radius:8px;background:#b7c2da;
  display:flex;flex-direction:column;justify-content:space-between}
.grocery .floor2{position:absolute;left:0;right:0;bottom:0;height:31%;border-top:6px solid #241a4d;
  background:repeating-conic-gradient(#eef1fa 0% 25%,#cdd5e9 0% 50%) 0 0/54px 54px}
.grocery .sign{position:absolute;left:50%;top:13%;transform:translateX(-50%);padding:5px 16px;
  border-radius:8px;background:#ffe066;color:#241a4d;border:4px solid #241a4d;
  font-size:15px;letter-spacing:2px;box-shadow:0 5px 0 #241a4d55;white-space:nowrap}

/* props: an egg carton and a pickle jar you can raid */
.eggbox{width:74px;height:40px;border-radius:6px 6px 9px 9px;background:linear-gradient(#f0d8a8,#c79b58);
  border:4px solid #241a4d;display:flex;justify-content:space-around;align-items:center;padding:0 5px}
.eggbox b{width:16px;height:19px;border-radius:50%;background:#fffbf0;border:3px solid #241a4d}
.picklejar{width:56px;height:74px;border-radius:9px 9px 14px 14px;
  background:linear-gradient(100deg,#cfe9c0,#8fc47a 60%,#5f9a4d);border:4px solid #241a4d}
.picklejar::before{content:'';position:absolute;left:-4px;right:-4px;top:-11px;height:16px;
  border-radius:5px;background:#c94f3d;border:4px solid #241a4d}
.picklejar b{position:absolute;left:9px;top:20px;width:14px;height:42px;border-radius:8px;
  background:#4f8a3c;box-shadow:20px -6px 0 -1px #5f9a4d}
/* thrown groceries and the mess they leave */
.fling{position:absolute;z-index:6;pointer-events:none;animation:flingto var(--ft) cubic-bezier(.4,.1,.7,1) forwards}
@keyframes flingto{0%{transform:translate(0,0) rotate(0) scale(.7)}
  45%{transform:translate(calc(var(--fx) * .5),calc(var(--fy) * .35 - 70px)) rotate(220deg) scale(1.05)}
  100%{transform:translate(var(--fx),var(--fy)) rotate(430deg) scale(.9)}}
.egg{width:26px;height:32px;border-radius:50% 50% 48% 48%;background:#fffbf0;border:3px solid #241a4d}
.pickle{width:18px;height:44px;border-radius:9px;background:linear-gradient(#7fb765,#3f7a2e);
  border:3px solid #241a4d}
.smear{position:absolute;border-radius:48% 52% 60% 40%;border:3px solid #00000026;
  background:var(--sc);animation:markin .2s;transition:transform 2.2s cubic-bezier(.6,0,.9,.4);z-index:7}
.smear.drip{transform:translateY(120px) rotate(18deg)}

/* ============ GAME SHELL ============ */
#game{position:relative;height:100%;display:flex;flex-direction:column}
header{position:relative;z-index:5;display:flex;align-items:center;gap:9px;padding:calc(9px + env(safe-area-inset-top)) 13px 8px}
.hud{flex:1;background:#ffffffdd;border:3px solid #241a4d;border-radius:14px;padding:5px 9px 6px;box-shadow:0 4px 0 #241a4d44}
.bossline{display:flex;align-items:baseline;gap:7px;color:#241a4d}
.bossline b{font-size:21px;letter-spacing:1px;font-weight:400}
.bossline span{font-family:system-ui;font-weight:800;font-size:8.5px;letter-spacing:2px;color:var(--c)}
.hpbar{margin-top:4px;height:14px;border:3px solid #241a4d;border-radius:9px;background:#d8dcf0;overflow:hidden}
.hpbar i{display:block;height:100%;width:100%;background:linear-gradient(#7ef29a,#22b859);transition:width .12s linear}
.hpbar.mid i{background:linear-gradient(#ffd75e,#f0a70b)}
.hpbar.low i{background:linear-gradient(#ff8e8e,#e01e2f);animation:pulse .55s infinite}
@keyframes pulse{50%{opacity:.5}}

#arena{position:relative;flex:1;overflow:hidden}
/* the floor line is a theme value, not a constant — every background sets its own */
#stage{position:absolute;left:0;right:0;bottom:var(--stage-bottom,15%);height:0;z-index:3}

/* ---- cutscene: the game steps back and lets you watch the boss act ---- */
#cinema{position:absolute;inset:0;z-index:8;opacity:0;pointer-events:none;transition:opacity .3s}
#cinema.on{opacity:1}
/* swallow taps only while the scene is actually playing — bars alone must never
   eat input, or the boss becomes untouchable and every hit reads as a miss */
#cinema.dim{pointer-events:auto}
#cinema .bar{position:absolute;left:0;right:0;height:0;background:#0b0713;
  transition:height .35s cubic-bezier(.3,1.3,.5,1)}
#cinema.on .bar{height:13%}
#cinema .bar.t{top:0}
#cinema .bar.b{bottom:0}
#cinema .veil{position:absolute;inset:0;opacity:0;transition:opacity .3s;
  background:radial-gradient(56% 44% at 50% 52%,transparent 38%,#0b0713e0)}
#cinema.dim .veil{opacity:1}
#cinema .card{position:absolute;left:50%;top:16%;transform:translateX(-50%) scale(.8);
  opacity:0;transition:transform .35s cubic-bezier(.2,1.6,.4,1),opacity .3s;text-align:center}
#cinema.dim .card{opacity:1;transform:translateX(-50%) scale(1)}
#cinema .ct{display:block;font-size:38px;color:var(--c);-webkit-text-stroke:6px #0b0713;
  paint-order:stroke fill;white-space:nowrap}
/* the line was white-on-busy-background and unreadable — give it its own solid plate */
#cinema .cs{display:block;font-family:system-ui;font-weight:800;font-size:15px;color:#241a4d;
  background:#fff;border:4px solid #241a4d;border-radius:14px;padding:8px 16px;margin:8px auto 0;
  box-shadow:0 5px 0 #0b0713aa;max-width:290px;line-height:1.35}
/* everything but the boss recedes */
.cine .room{filter:saturate(.25) brightness(.5)}
.cine #weapons,.cine header{filter:saturate(.3) brightness(.6)}
.cine .boss{filter:drop-shadow(0 0 26px #ffffff77)}
.puppet{position:absolute;left:50%;bottom:0;width:200px;height:330px;margin-left:-100px;will-change:transform}

/* ============ SKELETON RIG ============
   DOM nesting IS the bone hierarchy: a child bone inherits its parent's rotation.
   JS only writes rotate() per bone, so forward kinematics is free. */
.boss{position:relative;width:200px;height:330px;--bodyh:330px;touch-action:none;cursor:grab}
.boss.held{cursor:grabbing}
.boss.held .shadow{opacity:.25}
.boss .shadow{position:absolute;left:50%;bottom:-8px;width:150px;height:22px;margin-left:-75px;
  border-radius:50%;background:#00000038;will-change:transform,opacity}
.bn{position:absolute}
.hip{left:100px;top:calc(var(--bodyh) - var(--leglen));width:0;height:0}
/* torso BONE carries only the transform — the shirt graphic is a separate clipped
   child, so head and arms (child bones) are never cut off by its overflow */
.torso{left:calc(var(--tw) / -2);top:calc(var(--th) * -1);width:var(--tw);height:calc(var(--th) + 18px);
  transform-origin:50% 100%}
/* The shirt used to BE the torso, which is why every outfit looked painted on.
   Now a bare body sits underneath and the garment is its own larger shape hanging
   over it, with a collar, a hem and sleeves that end where fabric would end. */
.body{position:absolute;inset:14px 12px 0;border-radius:34px 34px 18px 18px;
  border:4px solid #241a4d;
  background:linear-gradient(160deg,color-mix(in srgb,var(--skin) 100%,#fff 16%),var(--skin))}
.shirt{position:absolute;left:-7px;right:-7px;top:16px;bottom:-7px;
  border-radius:30px 30px 26px 26px;border:4px solid #241a4d;overflow:hidden;
  background:linear-gradient(155deg,color-mix(in srgb,var(--shirt) 100%,#fff 30%),var(--shirt) 46%,
    color-mix(in srgb,var(--shirt) 70%,#000 30%))}
.hem{position:absolute;left:0;right:0;bottom:0;height:13px;
  border-top:3px solid #00000038;background:color-mix(in srgb,var(--shirt) 72%,#000 28%)}
.collar{position:absolute;left:50%;top:6px;width:54px;height:22px;margin-left:-27px;
  border-radius:0 0 46% 46%;border:4px solid #241a4d;border-top:0;
  background:color-mix(in srgb,var(--shirt) 78%,#000 22%)}
.sleeve{position:absolute;left:-5px;right:-5px;top:-5px;height:58%;border-radius:16px 16px 12px 12px;
  border:4px solid #241a4d;
  background:linear-gradient(color-mix(in srgb,var(--shirt) 100%,#fff 20%),var(--shirt))}
.shirt .logo{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);font-size:42px;color:#ffffffcc;
  text-shadow:0 3px 0 #00000033}
.shirt .shine{position:absolute;left:-10%;top:-30%;width:56%;height:150%;transform:rotate(18deg);
  background:linear-gradient(90deg,#ffffff44,#ffffff00)}
.suit .shirt{background:linear-gradient(155deg,#ff6d7c,var(--shirt) 45%,#a8121f)}
.suit .shirt::before{content:'';position:absolute;left:50%;top:-4px;width:58px;height:74px;transform:translateX(-50%);
  background:#fff;clip-path:polygon(50% 100%,0 0,100% 0)}
.suit .shirt::after{content:'';position:absolute;left:50%;top:10px;width:15px;height:34px;transform:translateX(-50%);
  background:#241a4d;clip-path:polygon(50% 0,100% 22%,72% 100%,28% 100%,0 22%)}
.suit .shirt .logo{top:74%;font-size:28px}

/* ball-jointed doll: every limb is its own piece with a visible rivet at the pivot */
.arm,.fore,.leg,.shin{box-shadow:0 3px 0 #00000022}
.arm{width:var(--armw);height:var(--uplen);border-radius:16px;border:4px solid #241a4d;transform-origin:50% 12%;
  background:linear-gradient(color-mix(in srgb,var(--skin) 100%,#fff 14%),var(--skin))}
.arm.l{left:calc(var(--armw) / -2 + 2px);top:16px}
.arm.r{left:calc(var(--tw) - var(--armw) / 2 - 2px);top:16px}
.fore{left:-4px;top:calc(var(--uplen) - 12px);width:var(--armw);height:var(--forelen);border-radius:16px;
  border:4px solid #241a4d;transform-origin:50% 14%;
  background:linear-gradient(color-mix(in srgb,var(--skin) 100%,#fff 14%),var(--skin))}
.hand{position:absolute;left:50%;bottom:-16px;width:30px;height:28px;margin-left:-15px;border-radius:50%;
  background:radial-gradient(circle at 36% 30%,color-mix(in srgb,var(--skin) 100%,#fff 30%),var(--skin));
  border:4px solid #241a4d}
.leg{width:var(--legw);height:var(--thighlen);border-radius:16px;border:4px solid #241a4d;transform-origin:50% 10%;
  background:linear-gradient(160deg,#4a5478,#2b3252)}
.leg.l{left:calc(var(--legspan) / -2);top:-8px}
.leg.r{left:calc(var(--legspan) / 2 - var(--legw));top:-8px}
.shin{left:-4px;top:calc(var(--thighlen) - 10px);width:var(--legw);height:var(--shinlen);border-radius:14px 14px 18px 18px;
  border:4px solid #241a4d;transform-origin:50% 12%;background:linear-gradient(160deg,#3d4668,#232a45)}

/* ============ HEAD / FACE ============ */
/* head is centred on the TORSO, not on the torso's left edge, and overlaps it at the neck */
.head{left:calc(var(--tw) / 2 - var(--hw) / 2);top:calc(var(--hh) * -1 + 16px);
  width:var(--hw);height:var(--hh);transform-origin:50% 100%}
.neck{position:absolute;left:50%;bottom:-20px;width:var(--neckw);height:28px;margin-left:calc(var(--neckw) / -2);
  background:color-mix(in srgb,var(--skin) 84%,#a0522d 16%);border-left:4px solid #241a4d;border-right:4px solid #241a4d}
.skull{position:absolute;inset:0;border-radius:var(--hr);border:4px solid #241a4d;overflow:hidden;
  background:radial-gradient(118% 88% at 32% 20%,color-mix(in srgb,var(--skin) 100%,#fff 32%),var(--skin) 52%,
    color-mix(in srgb,var(--skin) 76%,#8a4a2a 24%))}
.skull .shade{position:absolute;inset:0;background:radial-gradient(88% 78% at 116% 86%,#00000036,transparent 60%)}
.gaunt .skull::after{content:'';position:absolute;left:0;right:0;top:50%;height:36%;
  background:radial-gradient(58% 100% at 0% 50%,#0000002e,transparent 70%),
             radial-gradient(58% 100% at 100% 50%,#0000002e,transparent 70%)}
.chub .cheekpad{position:absolute;top:56%;width:30px;height:22px;border-radius:50%;background:#ff8a9a4d}
.chub .cheekpad.l{left:6px}.chub .cheekpad.r{right:6px}
.ear{position:absolute;top:42%;width:19px;height:26px;border-radius:50%;border:4px solid #241a4d;background:var(--skin)}
.ear.l{left:-11px}.ear.r{right:-11px}
.hair{position:absolute;left:-5px;right:-5px;top:-8px;height:var(--hairh);border-radius:var(--hairr);
  background:linear-gradient(160deg,color-mix(in srgb,var(--hair) 100%,#fff 24%),var(--hair) 58%);
  border:4px solid #241a4d;border-bottom:0}
.fringe{position:absolute;left:-5px;top:calc(var(--hairh) - 14px);width:var(--fringew);height:var(--fringeh);
  background:linear-gradient(160deg,color-mix(in srgb,var(--hair) 100%,#fff 20%),var(--hair));
  border:4px solid #241a4d;border-top:0;border-radius:0 0 62% 20%}
.beard{position:absolute;left:2px;right:2px;bottom:0;height:48%;border-radius:14% 14% 46% 46%;
  background:linear-gradient(#0000,var(--hair) 22%);border:4px solid #241a4d;border-top:0}
.stache{position:absolute;left:50%;bottom:calc(var(--mouthb) + 15px);width:52px;height:14px;margin-left:-26px;
  border-radius:40% 40% 50% 50%;background:var(--hair);border:3px solid #241a4d}
.headset{position:absolute;left:-14px;right:-14px;top:2px;height:50px;border-radius:50% 50% 0 0/100% 100% 0 0;
  border:5px solid #241a4d;border-bottom:0}
.headset::after,.headset::before{content:'';position:absolute;top:42px;width:23px;height:29px;border-radius:8px;background:#241a4d}
.headset::after{left:-9px}.headset::before{right:-9px}
.glasses{position:absolute;left:-6px;right:-6px;top:calc(var(--eyey) - 6px);height:calc(var(--eyeh) + 12px);
  border-top:4px solid #241a4d;pointer-events:none}
.glasses i{position:absolute;top:0;width:calc(var(--eyew) + 14px);height:100%;border:4px solid #241a4d;border-radius:8px;
  background:#bcd8ff33}
.glasses i:first-child{left:4px}.glasses i:last-child{right:4px}

.eye{position:absolute;top:var(--eyey);width:var(--eyew);height:var(--eyeh);border-radius:50%;background:#fff;
  border:4px solid #241a4d;overflow:hidden}
.eye.l{left:var(--eyex)}.eye.r{right:var(--eyex)}
.eye b{position:absolute;left:26%;top:30%;width:44%;height:44%;border-radius:50%;background:var(--iris)}
.eye b::after{content:'';position:absolute;right:0;top:0;width:38%;height:38%;border-radius:50%;background:#fff}
/* lids animate with transform only — no layout thrash per hit */
.lid{position:absolute;left:-2px;right:-2px;top:-2px;height:100%;background:var(--skin);border-bottom:4px solid #241a4d;
  transform-origin:50% 0;transform:scaleY(0);transition:transform .07s}
.brow{position:absolute;top:calc(var(--eyey) - var(--browlift));width:var(--broww);height:var(--browh);
  border-radius:5px;background:color-mix(in srgb,var(--hair) 72%,#241a4d 28%);transition:transform .08s}
.brow.l{left:calc(var(--eyex) - 2px);transform:rotate(-7deg)}
.brow.r{right:calc(var(--eyex) - 2px);transform:rotate(7deg)}
.nose{position:absolute;left:50%;top:calc(var(--eyey) + var(--nosey));width:var(--nosew);height:var(--noseh);
  margin-left:calc(var(--nosew) / -2);border-radius:50% 50% 46% 46%;
  background:color-mix(in srgb,var(--skin) 74%,#a0522d 26%)}
.mouth{position:absolute;left:50%;bottom:var(--mouthb);width:var(--mouthw);height:var(--mouthh);
  margin-left:calc(var(--mouthw) / -2);border-radius:0 0 22px 22px;background:#8e2b3f;border:4px solid #241a4d;
  border-top:0;overflow:hidden;transform-origin:50% 0;transition:transform .07s}
.mouth .teeth{position:absolute;left:0;right:0;top:0;height:5px;background:#fff}
.grin .mouth{height:26px;background:#fff;border-radius:8px 8px 28px 28px}
.grin .mouth .teeth{height:52%;box-shadow:0 3px 0 #241a4d}
.chin{position:absolute;left:50%;bottom:2px;width:var(--chinw);height:12px;margin-left:calc(var(--chinw) / -2);
  border-radius:0 0 50% 50%;background:#00000014}
.hood{position:absolute;left:-10px;right:-10px;top:-14px;bottom:-6px;border-radius:52% 52% 44% 44%;
  border:4px solid #241a4d;background:linear-gradient(158deg,color-mix(in srgb,var(--shirt) 100%,#fff 22%),var(--shirt) 55%,
    color-mix(in srgb,var(--shirt) 66%,#000 34%))}

/* ---- BITCOIN: nobody knows the face. Shadow under the hood, two burning eyes. ---- */
.void{position:absolute;inset:10% 12% 12%;border-radius:50% 50% 46% 46%;
  background:radial-gradient(circle at 50% 34%,#151827,#05060c 72%);border:4px solid #241a4d;overflow:hidden}
.void::after{content:'₿';position:absolute;left:50%;top:6%;transform:translateX(-50%);font-size:26px;
  color:var(--c);opacity:.22}
.glow{position:absolute;top:46%;width:26px;height:13px;border-radius:50%;background:var(--c);
  box-shadow:0 0 16px var(--c),0 0 34px var(--c);animation:emberglow 2.6s ease-in-out infinite}
.glow.l{left:20%}.glow.r{right:20%}
.glow.r{animation-delay:.4s}
@keyframes emberglow{50%{opacity:.45;transform:scaleY(.7)}}
.wisp{position:absolute;left:50%;top:-26px;margin-left:-30px;width:60px;height:30px;pointer-events:none;
  background:radial-gradient(closest-side,color-mix(in srgb,var(--c) 40%,transparent),transparent);
  filter:blur(3px);animation:wisp 3.4s ease-in-out infinite}
@keyframes wisp{50%{transform:translateY(-9px) scaleX(1.25);opacity:.5}}
.ouch .glow{background:#fff;box-shadow:0 0 26px #fff}

/* ---- FTX: one big mop, low over the brow. Lobes are large and overlapping so the
   outline reads as curls rather than a row of separate balls. ---- */
.afro{position:absolute;left:-30px;right:-30px;top:-52px;height:82px;
  border-radius:54% 54% 40% 40%;z-index:2;
  background:radial-gradient(circle at 34% 24%,color-mix(in srgb,var(--hair) 100%,#fff 28%),var(--hair) 74%);
  /* a border on each lobe drew a closed ring around every ball. Stacked drop-shadows
     trace the ALPHA of the whole group instead, so the mass gets ONE outline and the
     lobes read as curls. The same trick outlines any merged silhouette. */
  filter:drop-shadow(3px 0 0 #241a4d) drop-shadow(-3px 0 0 #241a4d)
         drop-shadow(0 3px 0 #241a4d) drop-shadow(0 -3px 0 #241a4d)}
.afro i{position:absolute;border-radius:50%;
  background:radial-gradient(circle at 38% 30%,color-mix(in srgb,var(--hair) 100%,#fff 22%),var(--hair));
  box-shadow:inset 0 -6px 0 #0000001a}
.afro i:nth-child(1){left:-16px;top:42px;width:56px;height:56px}
.afro i:nth-child(2){right:-16px;top:38px;width:58px;height:58px}
.afro i:nth-child(3){left:6%;top:-20px;width:66px;height:66px}
.afro i:nth-child(4){right:4%;top:-24px;width:60px;height:60px}
.afro i:nth-child(5){left:35%;top:-30px;width:56px;height:56px}
.bare .shin{background:linear-gradient(color-mix(in srgb,var(--skin) 100%,#fff 12%),var(--skin))}

/* ---- headpiece demo: border-radius cannot make a spike, but clip-path can, and the
   same stacked drop-shadow wraps the whole assembly in ONE outline. Any hat, crown,
   helmet or cape can be built this way and layered over the body. ---- */
.crown{position:absolute;left:50%;top:-42px;width:104px;height:48px;margin-left:-52px;z-index:4;
  /* four axis shadows leave the spikes stepped, so add the diagonals too */
  filter:drop-shadow(3px 0 0 #241a4d) drop-shadow(-3px 0 0 #241a4d)
         drop-shadow(0 3px 0 #241a4d) drop-shadow(0 -3px 0 #241a4d)
         drop-shadow(2px 2px 0 #241a4d) drop-shadow(-2px 2px 0 #241a4d)
         drop-shadow(2px -2px 0 #241a4d) drop-shadow(-2px -2px 0 #241a4d)}
.crown i{position:absolute;bottom:14px;width:36px;height:38px;
  background:linear-gradient(#fff3b0,#f0c33c 55%,#c99512);
  clip-path:polygon(50% 0,100% 100%,0 100%)}
.crown i:nth-child(1){left:0}
.crown i:nth-child(2){left:50%;margin-left:-21px;width:42px;height:50px}
.crown i:nth-child(3){right:0}
.crown b{position:absolute;left:0;right:0;bottom:0;height:19px;border-radius:5px;
  background:linear-gradient(#ffe680,#e8b21f 60%,#b8860b)}
.crown s{position:absolute;bottom:3px;left:50%;width:12px;height:12px;margin-left:-6px;
  border-radius:50%;background:#ff3b4e;text-decoration:none}
.crown s::before,.crown s::after{content:'';position:absolute;top:1px;width:9px;height:9px;
  border-radius:50%;background:#5fcade}
.crown s::before{left:-20px}
.crown s::after{right:-20px}
.bare .leg{background:linear-gradient(160deg,#5b6480,#39415f)}
/* ---- SQUID-style rug: anonymous dev, so the mask is the face ---- */
.rugmask{position:absolute;inset:9% 11% 11%;border-radius:50% 50% 46% 46%;
  background:radial-gradient(circle at 38% 28%,#ffffff,#dbe0f2 72%);border:4px solid #241a4d;overflow:hidden}
.rugmask i{position:absolute;top:36%;width:17px;height:17px;border-radius:50%;background:#241a4d}
.rugmask i.l{left:22%}.rugmask i.r{right:22%}
.rugmask b{position:absolute;left:50%;bottom:16%;width:58px;height:20px;margin-left:-29px;
  border-radius:0 0 30px 30px;background:#241a4d}
.rugmask::after{content:'';position:absolute;left:50%;top:14%;width:30px;height:6px;margin-left:-15px;
  border-radius:4px;background:#ff2d78}
.bag{position:absolute;left:50%;bottom:-30px;margin-left:-20px;font-size:38px;
  filter:drop-shadow(0 3px 0 #0002);animation:bagswing 1.6s ease-in-out infinite}
@keyframes bagswing{50%{transform:rotate(-14deg) translateY(-4px)}}
/* permanently smug */
.smirk .mouth{border-radius:0 0 24px 5px;transform:rotate(-6deg)}
.smirk .ouch .mouth{transform:rotate(0) scaleY(2.1)}

/* ---- DOGECOIN: the shiba itself, not a person ---- */
.dogeskull{position:absolute;inset:0;border-radius:48% 48% 44% 44%;border:4px solid #241a4d;
  background:radial-gradient(112% 90% at 34% 22%,#f4d79a,#e0b163 56%,#c2924a)}
.dear{position:absolute;top:-26px;width:40px;height:48px;border:4px solid #241a4d;
  background:linear-gradient(#e6bb72,#c2924a);border-radius:52% 52% 12% 12%}
.dear.l{left:2px;transform:rotate(-14deg)}
.dear.r{right:2px;transform:rotate(14deg)}
.dear::after{content:'';position:absolute;inset:22% 26% 14%;border-radius:50% 50% 12% 12%;background:#a3653c}
.dbrow{position:absolute;top:22%;width:24px;height:8px;border-radius:5px;background:#c9964f;transition:transform .08s}
.dbrow.l{left:14%;transform:rotate(-12deg)}
.dbrow.r{right:14%;transform:rotate(12deg)}
.deye{position:absolute;top:34%;width:20px;height:22px;border-radius:50%;background:#fff;border:4px solid #241a4d;overflow:hidden}
.deye.l{left:16%}.deye.r{right:16%}
.deye b{position:absolute;left:22%;top:26%;width:52%;height:52%;border-radius:50%;background:#2a1c10}
.deye b::after{content:'';position:absolute;right:0;top:0;width:40%;height:40%;border-radius:50%;background:#fff}
.snout{position:absolute;left:50%;bottom:6%;width:60%;height:40%;margin-left:-30%;border-radius:44% 44% 50% 50%;
  background:radial-gradient(circle at 50% 26%,#fdf1d6,#f0dcae);border:4px solid #241a4d}
.dnose{position:absolute;left:50%;top:8%;width:26px;height:19px;margin-left:-13px;border-radius:48%;
  background:#241a4d}
.dmouth{position:absolute;left:50%;top:44%;width:34px;height:16px;margin-left:-17px;
  border:4px solid #241a4d;border-top:0;border-radius:0 0 20px 20px;background:#b8455e;
  transform-origin:50% 0;transition:transform .07s}
.ouch .dmouth{transform:scaleY(2.2)}
.doge[data-x] .dbrow{transform:none}
.boss[data-d="2"] .dbrow.l,.boss[data-d="3"] .dbrow.l,.boss[data-d="4"] .dbrow.l{transform:rotate(20deg)}
.boss[data-d="2"] .dbrow.r,.boss[data-d="3"] .dbrow.r,.boss[data-d="4"] .dbrow.r{transform:rotate(-20deg)}
.boss[data-d="2"] .deye.l,.boss[data-d="3"] .deye.l,.boss[data-d="4"] .deye.l{background:#a679d8;box-shadow:0 0 0 5px #7a3fb388}

/* ---- damage ---- */
.marks{position:absolute;left:-100px;top:calc((var(--bodyh) - var(--leglen)) * -1);width:200px;height:var(--bodyh);pointer-events:none;z-index:6}
/* direct children only — the pizza's own <i> parts live in here too */
.marks > i{position:absolute;width:26px;height:20px;border-radius:50%;transform:translate(-50%,-50%) rotate(var(--r));
  background:radial-gradient(closest-side,#8b3bd6cc,#5a1e9955);box-shadow:0 0 0 2px #4a147d33;animation:markin .18s}
.marks > i.cut{width:24px;height:6px;border-radius:3px;background:#d61b2f;box-shadow:0 0 0 2px #8e0d1a55}
@keyframes markin{from{transform:translate(-50%,-50%) scale(0)}}
.boss[data-d="1"] .brow.l,.boss[data-d="2"] .brow.l,.boss[data-d="3"] .brow.l,.boss[data-d="4"] .brow.l{transform:rotate(18deg)}
.boss[data-d="1"] .brow.r,.boss[data-d="2"] .brow.r,.boss[data-d="3"] .brow.r,.boss[data-d="4"] .brow.r{transform:rotate(-18deg)}
.boss[data-d="2"] .eye.l,.boss[data-d="3"] .eye.l,.boss[data-d="4"] .eye.l{background:#a679d8;box-shadow:0 0 0 6px #7a3fb388}
.boss[data-d="2"] .mouth,.boss[data-d="3"] .mouth,.boss[data-d="4"] .mouth{transform:scaleY(1.5)}
.boss[data-d="3"] .skull::before,.boss[data-d="4"] .skull::before{content:'';position:absolute;right:4px;top:20%;
  width:38px;height:14px;background:#ffd9a8;border:4px solid #241a4d;border-radius:4px;transform:rotate(-16deg);z-index:7}
.boss[data-d="4"] .eye b{animation:dizzy .8s linear infinite}
@keyframes dizzy{to{transform:rotate(360deg) translateX(3px)}}
.boss[data-d="4"] .stars,.boss[data-d="3"] .sweat,.boss[data-d="4"] .sweat{display:block}
.stars{display:none;position:absolute;left:50%;top:-30px;margin-left:-40px;font-size:20px;z-index:8;
  animation:starspin 1.4s linear infinite;white-space:nowrap}
@keyframes starspin{50%{transform:translateY(-5px) rotate(9deg)}}
.sweat{display:none;position:absolute;right:-16px;top:6px;font-size:20px;z-index:8;animation:sweatdrop 1.1s ease-in infinite}
@keyframes sweatdrop{0%{transform:translateY(0);opacity:0}25%{opacity:1}100%{transform:translateY(26px);opacity:0}}
.ouch .skull,.ouch .shirt,.ouch .sleeve,.ouch .collar,.ouch .hood,.ouch .dogeskull,.ouch .snout{filter:brightness(1.75) saturate(.35)}
.ouch .mouth{transform:scaleY(2.1)}
.ouch .lid{transform:scaleY(.5)}
.ouch .brow.l{transform:rotate(26deg)}
.ouch .brow.r{transform:rotate(-26deg)}
.scared .mouth{transform:scaleY(1.8)}

/* signature-reaction flair, one per boss */
.sig-dash{animation:sigdash .5s}
@keyframes sigdash{35%{opacity:.22;filter:blur(1.5px)}}
.sig-ghost .glow{background:#fff;box-shadow:0 0 26px #fff,0 0 60px var(--c)}
.sig-think .eye b{transform:translate(3px,-6px)}
.sig-pop .dear{animation:earflap .26s 3 alternate}
@keyframes earflap{to{transform:rotate(0deg) scaleY(.68)}}
.sig-fly{filter:saturate(1.5)}
.sig-shrug .mouth{transform:rotate(-14deg) scaleY(.8)}
.sig-panic .afro{animation:afrob .55s}
@keyframes afrob{40%{transform:translateY(-11px) scaleX(1.12)}}
.sig-hug .bag{transform:scale(1.4) rotate(-14deg)}

#purse{position:absolute;left:12px;top:10px;z-index:6;font-size:20px;color:#ffe066;
  -webkit-text-stroke:5px #241a4d;paint-order:stroke fill;transition:transform .12s}
#purse.bump{transform:scale(1.3)}
/* coins spill out of him, lie on the floor, then get swept into the purse in batches.
   They live in the floor layer, which is pointer-events:none, so they never eat a tap. */
.gold{position:absolute;width:23px;height:23px;margin:-11px 0 0 -11px;border-radius:50%;
  display:grid;place-items:center;
  background:radial-gradient(circle at 34% 28%,#ffeaa0,#f7d35f 54%,#dba91f 90%);
  border:3px solid #241a4d;box-shadow:0 2px 0 #0000002e,inset 0 0 0 2px #fff3c07a;
  animation:goldfall .58s cubic-bezier(.35,.5,.5,1) both}
.gold::after{content:'₿';font-family:system-ui,sans-serif;font-weight:900;font-size:14px;
  line-height:1;color:#241a4d}
@keyframes goldfall{
  0%{transform:translate(var(--sx),var(--sy)) scale(.5)}
  40%{transform:translate(calc(var(--sx) * .42),calc(var(--sy) * .34 - 44px)) scale(1.03)}
  70%{transform:translate(calc(var(--sx) * .08),0) scale(1.08,.9)}
  86%{transform:translate(0,-6px) rotate(calc(var(--r) * .8))}
  100%{transform:translate(0,0) rotate(var(--r)) scale(1)}}
.gold.gone{animation:goldgo .6s ease-in forwards}
@keyframes goldgo{
  0%{transform:translate(0,0) rotate(var(--r)) scale(1);opacity:1}
  25%{transform:translate(calc(var(--gx) * .18),calc(var(--gy) * .18 - 34px)) scale(1.2)}
  100%{transform:translate(var(--gx),var(--gy)) scale(.25);opacity:0}}
.dmg.crit{font-size:66px;color:#ffe066}
.critlabel{position:absolute;font-size:30px;color:#fff;-webkit-text-stroke:6px #c81e3a;paint-order:stroke fill;
  animation:critpop .6s forwards}
@keyframes critpop{0%{transform:translate(-50%,0) scale(.3) rotate(-14deg)}
  30%{transform:translate(-50%,-30px) scale(1.25) rotate(6deg)}100%{transform:translate(-50%,-64px) scale(1);opacity:0}}

.shake-s{animation:shk .16s}.shake-m{animation:shk .26s}.shake-l{animation:shk .42s}
@keyframes shk{0%,100%{transform:translate(0,0)}20%{transform:translate(-9px,6px)}40%{transform:translate(8px,-7px)}60%{transform:translate(-7px,-4px)}80%{transform:translate(6px,6px)}}



/* ================= AIMED WEAPON =================
   The selected weapon rides the pointer and tilts so its business end faces the boss.
   Drawn, not emoji, so it reads as a real object; one outline via the drop-shadow
   union trick. Never accepts pointer events. */
#aim{position:absolute;left:0;top:0;z-index:6;pointer-events:none;opacity:0;
  transition:opacity .12s;will-change:transform}
#aim.on{opacity:1}
.wpn{position:absolute;left:0;top:0;transform:translate(-50%,-50%);
  filter:drop-shadow(3px 0 0 #241a4d) drop-shadow(-3px 0 0 #241a4d)
         drop-shadow(0 3px 0 #241a4d) drop-shadow(0 -3px 0 #241a4d)
         drop-shadow(0 8px 6px #0000003d)}
#aim.hit .wpn{animation:wswing .22s cubic-bezier(.3,1.5,.5,1)}
@keyframes wswing{45%{transform:translate(-50%,-10%) scale(1.14)}}
/* swung weapons travel through an arc around the grip, not straight down */
#aim.arc.hit .wpn{transform-origin:50% 9%;animation:warc .3s cubic-bezier(.22,.9,.32,1)}
@keyframes warc{
  0%{transform:translate(-50%,-50%) rotate(-82deg) scale(.94)}
  20%{transform:translate(-50%,-50%) rotate(-64deg) scale(.97)}
  62%{transform:translate(-50%,-46%) rotate(30deg) scale(1.08)}
  100%{transform:translate(-50%,-50%) rotate(0deg) scale(1)}}
.swoosh{position:absolute;left:0;top:0;width:150px;height:150px;margin:-75px 0 0 -75px;
  border-radius:50%;border:8px solid transparent;border-top-color:#ffffffd9;
  border-right-color:#ffffff66;opacity:0;pointer-events:none}
#aim.arc.hit .swoosh{animation:swoosh .3s ease-out}
@keyframes swoosh{0%{opacity:0;transform:rotate(-150deg) scale(.62)}
  30%{opacity:.95}100%{opacity:0;transform:rotate(34deg) scale(1.18)}}
/* thrown weapons are held small and cocked back, then leave the hand on release */
#aim.throwable .wpn{transform:translate(-50%,-50%) scale(.62) rotate(-24deg)}
#aim.tossed .wpn{animation:wtoss .38s ease-in forwards}
@keyframes wtoss{to{transform:translate(-50%,150%) scale(.28) rotate(260deg);opacity:0}}
.wpn i{position:absolute}

/* red candle: an actual candlestick, wick and all */
.w-candle{width:34px;height:96px}
.w-candle i:nth-child(1){left:15px;top:0;width:4px;height:96px;background:#8e1c2c}
.w-candle i:nth-child(2){left:0;top:20px;width:34px;height:58px;border-radius:4px;
  background:linear-gradient(100deg,#ff7d7d,#e01e2f 45%,#a2101f)}
/* bat: knob, thin grip, and a barrel that actually tapers out. Pieces overlap and the
   union outline welds them into one silhouette. */
.w-bat{width:44px;height:158px}
.w-bat i:nth-child(1){left:9px;top:0;width:26px;height:14px;border-radius:7px;
  background:linear-gradient(100deg,#6d4620,#43290f)}
.w-bat i:nth-child(2){left:14px;top:9px;width:16px;height:64px;border-radius:6px;
  background:linear-gradient(100deg,#8a5c2a,#5c3a16)}
.w-bat i:nth-child(3){left:8px;top:58px;width:28px;height:40px;border-radius:12px;
  background:linear-gradient(100deg,#f2dcae,#c99a52 55%,#8d6524)}
.w-bat i:nth-child(4){left:1px;top:84px;width:42px;height:74px;border-radius:16px 16px 21px 21px;
  background:linear-gradient(100deg,#f7e4bd,#d2a55c 48%,#916826)}
.w-bat i:nth-child(5){left:10px;top:100px;width:5px;height:44px;border-radius:3px;
  background:#ffffff4d}
/* hammer: handle plus a heavy head */
.w-hammer{width:70px;height:104px}
.w-hammer i:nth-child(1){left:27px;top:22px;width:16px;height:82px;border-radius:7px;
  background:linear-gradient(#7a5228,#48300f)}
.w-hammer i:nth-child(2){left:0;top:0;width:70px;height:38px;border-radius:8px;
  background:linear-gradient(160deg,#c7cede,#7d879e 55%,#4d5468)}
/* doge missile: a snarling shiba, not a dog emoji */
.w-doge{width:78px;height:78px}
.w-doge i:nth-child(1),.w-doge i:nth-child(2){top:-2px;width:26px;height:32px;
  border-radius:52% 52% 12% 12%;background:#c98f43}
.w-doge i:nth-child(1){left:2px;transform:rotate(-16deg)}
.w-doge i:nth-child(2){right:2px;transform:rotate(16deg)}
.w-doge i:nth-child(3){left:3px;top:10px;width:72px;height:66px;border-radius:48% 48% 44% 44%;
  background:radial-gradient(circle at 36% 30%,#f4d79a,#dcae61)}
.w-doge i:nth-child(4),.w-doge i:nth-child(5){top:28px;width:20px;height:7px;
  border-radius:4px;background:#8a5c22}
.w-doge i:nth-child(4){left:11px;transform:rotate(22deg)}
.w-doge i:nth-child(5){right:11px;transform:rotate(-22deg)}
.w-doge i:nth-child(6),.w-doge i:nth-child(7){top:36px;width:12px;height:12px;
  border-radius:50%;background:#2a1c10}
.w-doge i:nth-child(6){left:16px}.w-doge i:nth-child(7){right:16px}
.w-doge i:nth-child(8){left:50%;top:48px;width:38px;height:26px;margin-left:-19px;
  border-radius:44% 44% 50% 50%;background:#fdf1d6}
.w-doge i:nth-child(9){left:50%;top:50px;width:16px;height:11px;margin-left:-8px;
  border-radius:48%;background:#241a4d}
/* the growl: a dark open mouth so the bared fangs actually read */
.w-doge i:nth-child(10){left:50%;top:60px;width:30px;height:15px;margin-left:-15px;
  border-radius:3px 3px 9px 9px;background:#5c1526}
.w-doge i:nth-child(11){left:50%;top:60px;width:30px;height:9px;margin-left:-15px;background:#fff;
  clip-path:polygon(0 0,100% 0,100% 35%,86% 100%,72% 35%,58% 100%,44% 35%,30% 100%,16% 35%,0 40%)}
/* whale: the heavy one */
.w-whale{width:104px;height:64px}
.w-whale i:nth-child(1){left:0;top:8px;width:86px;height:52px;border-radius:52% 46% 46% 52%;
  background:linear-gradient(160deg,#7fb6f2,#2f6fbf 60%,#1d4a86)}
.w-whale i:nth-child(2){right:0;top:0;width:34px;height:34px;
  background:#2f6fbf;clip-path:polygon(0 100%,100% 0,100% 100%)}
.w-whale i:nth-child(3){left:14px;top:30px;width:12px;height:12px;border-radius:50%;background:#fff}
.w-whale i:nth-child(4){left:17px;top:33px;width:6px;height:6px;border-radius:50%;background:#241a4d}

/* ============ FX ============ */
#fx{position:absolute;inset:0;z-index:7;pointer-events:none;overflow:hidden}
#flash{position:absolute;inset:0;z-index:8;pointer-events:none;background:#fff;opacity:0}
#flash.on{animation:flash .13s}
@keyframes flash{from{opacity:.8}to{opacity:0}}
.dmg{position:absolute;font-size:34px;color:#fff;-webkit-text-stroke:5px #241a4d;paint-order:stroke fill;animation:dmg .7s forwards}
.dmg.big{font-size:60px;color:#ffe066}
.dmg.blk{font-size:22px;color:#cfd6ff;-webkit-text-stroke:4px #241a4d}
.dmg.miss{font-size:26px;color:#b9c2e8}
@keyframes dmg{0%{transform:translate(-50%,0) scale(.5)}25%{transform:translate(-50%,-24px) scale(1.2)}100%{transform:translate(-50%,-78px) scale(.9);opacity:0}}
.spark{position:absolute;font-size:52px;transform:translate(-50%,-50%);animation:spark .34s forwards}
@keyframes spark{0%{transform:translate(-50%,-50%) scale(.3) rotate(-20deg)}100%{transform:translate(-50%,-50%) scale(1.6) rotate(15deg);opacity:0}}
.boom{position:absolute;width:150px;height:150px;transform:translate(-50%,-50%);
  background:radial-gradient(closest-side,#fff,#ffe066 45%,#ff8a00 62%,transparent 70%);
  clip-path:polygon(50% 0,61% 26%,88% 14%,76% 40%,100% 50%,76% 60%,88% 86%,61% 74%,50% 100%,39% 74%,12% 86%,24% 60%,0 50%,24% 40%,12% 14%,39% 26%);
  animation:boom .3s forwards}
@keyframes boom{from{transform:translate(-50%,-50%) scale(.2)}to{transform:translate(-50%,-50%) scale(1.5) rotate(22deg);opacity:0}}
.ring{position:absolute;width:60px;height:60px;transform:translate(-50%,-50%);border-radius:50%;border:7px solid #fff;animation:ring .34s forwards}
@keyframes ring{to{transform:translate(-50%,-50%) scale(3.4);opacity:0;border-width:1px}}
.bit{position:absolute;width:12px;height:12px;border-radius:3px;background:#ffe066;border:2px solid #241a4d;animation:bit .6s forwards ease-out}
@keyframes bit{to{transform:translate(var(--dx),var(--dy)) rotate(320deg);opacity:0}}
.dust{position:absolute;width:70px;height:22px;transform:translate(-50%,-50%);border-radius:50%;background:#ffffffcc;animation:dust .42s forwards}
@keyframes dust{to{transform:translate(-50%,-50%) scaleX(2.6) scaleY(.5);opacity:0}}
.shout{position:absolute;transform:translate(-50%,-100%);padding:6px 13px;border-radius:15px;background:#fff;
  color:#241a4d;border:4px solid #241a4d;font-size:20px;max-width:74%;text-align:center;animation:shout 1.5s forwards}
.shout::after{content:'';position:absolute;left:24px;bottom:-15px;border:8px solid transparent;border-top-color:#241a4d}
@keyframes shout{0%{transform:translate(-50%,-100%) scale(.3) rotate(-8deg)}14%{transform:translate(-50%,-112%) scale(1.08) rotate(2deg)}
  22%{transform:translate(-50%,-108%) scale(1)}82%{opacity:1}100%{transform:translate(-50%,-128%) scale(1);opacity:0}}
.banner-fx{position:absolute;left:50%;top:12%;transform:translateX(-50%);white-space:nowrap;font-size:42px;
  -webkit-text-stroke:6px #241a4d;paint-order:stroke fill;animation:ban .95s forwards}
@keyframes ban{0%{transform:translateX(-50%) scale(.4) rotate(-7deg)}18%{transform:translateX(-50%) scale(1.14) rotate(3deg)}70%{opacity:1}100%{transform:translateX(-50%) scale(1) translateY(-26px);opacity:0}}
/* mechanic callout — tells the player, in plain words, what the boss just did */
#callout{position:absolute;left:50%;top:25%;z-index:8;width:86%;max-width:400px;opacity:0;pointer-events:none;
  background:#fff;border:4px solid #241a4d;border-radius:17px;padding:8px 14px 10px;
  box-shadow:0 6px 0 #241a4d55;color:#241a4d;text-align:center;transform:translate(-50%,0)}
#callout.on{animation:callout 3.1s forwards}
#callout b{display:inline-block;background:var(--c);color:#241a4d;padding:2px 12px;border-radius:999px;
  font-size:18px;letter-spacing:1px;border:3px solid #241a4d}
#callout span{display:block;font-family:system-ui;font-weight:700;font-size:11.5px;line-height:1.4;margin-top:6px}
@keyframes callout{0%{opacity:0;transform:translate(-50%,-28px) scale(.85)}
  8%{opacity:1;transform:translate(-50%,0) scale(1.05)}13%{transform:translate(-50%,0) scale(1)}
  86%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-18px)}}
.bossline em{margin-left:auto;font-style:normal;font-family:system-ui;font-weight:800;font-size:8px;
  letter-spacing:1px;background:#241a4d;color:#fff;border-radius:999px;padding:3px 8px;white-space:nowrap}

.whalefly{position:absolute;top:26%;left:-30%;font-size:130px;animation:whalefly .9s ease-in forwards}
@keyframes whalefly{100%{left:110%;transform:rotate(-14deg)}}
.swing{position:absolute;font-size:76px;transform-origin:80% 80%;animation:swing .3s forwards}
@keyframes swing{0%{transform:translate(-60%,-160%) rotate(-95deg);opacity:0}35%{opacity:1}
  60%{transform:translate(-50%,-70%) rotate(12deg)}100%{transform:translate(-50%,-64%) rotate(6deg);opacity:0}}
.drop{position:absolute;font-size:46px;transform:translate(-50%,-50%);animation:drop .26s forwards}
@keyframes drop{0%{transform:translate(-50%,-260%) scale(.7);opacity:0}45%{opacity:1}100%{transform:translate(-50%,-50%) scale(1.1);opacity:0}}
.fly{position:absolute;font-size:60px;transform:translate(-50%,-50%);animation:fly .3s ease-in forwards}
@keyframes fly{0%{transform:translate(-460%,60%) scale(.6) rotate(-30deg)}100%{transform:translate(-50%,-50%) scale(1.25) rotate(12deg)}}
.splat{position:absolute;width:120px;height:120px;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(closest-side,#ffd75e,#ff8a00 60%,transparent 70%);animation:boom .45s forwards}

/* ---- an actual slice: burnt crust, molten cheese, pepperoni, hanging strings ---- */
.pza{position:absolute;width:112px;height:104px;margin:-52px 0 0 -56px;pointer-events:none;
  filter:drop-shadow(0 5px 0 #0000001f)}
.pza i{position:absolute}
.pza .ink{inset:0;background:#5e2f08;clip-path:polygon(50% 100%,0 7%,100% 7%)}
.pza .chz{inset:5px 7px 8px;clip-path:polygon(50% 100%,0 7%,100% 7%);
  background:radial-gradient(120% 110% at 36% 14%,#ffeaa2,#f5bf52 52%,#e79b2c)}
.pza .grease{left:16%;top:26%;width:26px;height:14px;border-radius:50%;background:#fff6c9;opacity:.5;
  transform:rotate(-18deg)}
.pza .crust{left:-3px;right:-3px;top:-2px;height:26px;border-radius:15px;
  background:linear-gradient(#f3c684,#cb8f43);border:4px solid #5e2f08}
.pza .crust::after{content:'';position:absolute;left:12%;top:5px;width:34%;height:5px;border-radius:4px;
  background:#ffe3b0;opacity:.7}
.pza .pep{width:21px;height:21px;margin:-10px 0 0 -10px;border-radius:50%;
  background:radial-gradient(circle at 34% 30%,#ff7d63,#c62b28 72%);border:3px solid #7d1614}
.pza .oli{width:11px;height:11px;margin:-5px 0 0 -5px;border-radius:50%;background:#4a2f56;border:2px solid #241a4d}
.pza .str{bottom:1px;width:9px;margin-left:-4px;border-radius:0 0 7px 7px;border:3px solid #d59a2f;border-top:0;
  background:linear-gradient(#ffd97a,#f0b23c);transform-origin:50% 0}
/* cheese oozing over the cut edges */
.pza .melt{width:22px;height:15px;margin:-7px 0 0 -11px;border-radius:50% 50% 60% 40%;
  background:radial-gradient(circle at 40% 32%,#ffeaa2,#f0b23c);border:3px solid #d59a2f}
.pza.thrown{animation:pzafly .34s ease-in forwards}
@keyframes pzafly{0%{transform:translate(-430px,130px) rotate(-240deg) scale(.45);opacity:0}
  30%{opacity:1}100%{transform:translate(0,0) rotate(15deg) scale(1.12)}}
/* variants scale the whole slice — never resize the box, or the fixed-px crust,
   pepperoni and cheese inset stop matching and the shape falls apart */
.pza.stuck{transform:rotate(var(--pr)) scale(.62);
  transition:transform 2.4s cubic-bezier(.6,0,.9,.4);z-index:7}
.pza.stuck.drip{transform:translateY(120px) rotate(42deg) scale(.62)}
.pza.floor{left:50%;top:0;margin:-52px 0 0 -56px;
  transform:rotate(var(--pr)) scale(.8) scaleY(.5)}

#mess{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden}
/* ---- background props: scenery you can turn on the boss. They deal no damage;
   the point is humiliation. The layer ignores pointers and only the prop itself
   accepts them, so a prop can never swallow an attack or register a miss. ---- */
#props{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden}
.prop{position:absolute;pointer-events:auto;cursor:pointer;touch-action:manipulation;
  animation:propdrift var(--dur) linear forwards}
@keyframes propdrift{to{transform:translateX(var(--dist))}}
.raincloud{width:96px;height:52px;border-radius:50% 50% 46% 46%;
  background:linear-gradient(#ffffff,#dbe6f7);border:4px solid #241a4d;
  box-shadow:0 5px 0 #00000018}
.raincloud::before,.raincloud::after{content:'';position:absolute;border-radius:50%;
  background:#f4f8ff;border:4px solid #241a4d}
.raincloud::before{left:6px;top:-22px;width:44px;height:44px}
.raincloud::after{right:8px;top:-16px;width:36px;height:36px}
.raincloud.dark{background:linear-gradient(#7d8bab,#4a5878)}
.raincloud.dark::before,.raincloud.dark::after{background:#8c99b8}
/* never touch `animation` here: re-declaring it restarts the drift from the left edge,
   and a transform keyframe would fight the one moving the cloud. Flash instead. */
.raincloud.dark{animation-name:propdrift,thunder;animation-duration:var(--dur),.4s;
  animation-timing-function:linear,ease-out;animation-iteration-count:1,3;
  animation-fill-mode:forwards,none}
@keyframes thunder{0%,100%{filter:none}30%{filter:brightness(1.9)}}
.drop{position:absolute;top:46px;width:6px;height:17px;border-radius:0 0 4px 4px;
  background:#7cb6e8;border:2px solid #2f5f92;animation:rainfall .8s linear infinite}
@keyframes rainfall{from{transform:translateY(0);opacity:0}
  15%{opacity:1}to{transform:translateY(var(--fall));opacity:.15}}
.puddle{position:absolute;height:15px;border-radius:50%;background:#7cb6e8c4;
  border:3px solid #2f5f9288;animation:stainin .4s ease-out}
/* the boss just gets soaked — no damage, only dignity */
.wet .skull,.wet .shirt,.wet .hood,.wet .dogeskull,.wet .snout,.wet .afro{filter:brightness(.86) saturate(.75)}
.wet{animation:shiver .12s infinite}
@keyframes shiver{50%{transform:translateX(1.5px)}}
.stain{position:absolute;width:var(--sw);height:calc(var(--sw) * .34);margin-left:calc(var(--sw) / -2);
  border-radius:50%;background:radial-gradient(closest-side,#ffd06a,#e0912c 62%,#a35a10);
  border:3px solid #8a4a0d;opacity:.92;animation:stainin .35s ease-out}
@keyframes stainin{from{transform:scale(.2) translateY(-30px);opacity:0}}

#gas,#peg{position:absolute;left:50%;top:8px;transform:translateX(-50%);z-index:6;width:162px;text-align:center;
  font-family:system-ui;font-weight:800;font-size:9px;letter-spacing:2px;color:#241a4d;
  background:#ffffffe6;border:3px solid #241a4d;border-radius:12px;padding:4px 8px 6px;box-shadow:0 4px 0 #241a4d44}
#gas .bar,#peg .bar{height:11px;margin-top:3px;border:3px solid #241a4d;border-radius:8px;background:#fff;overflow:hidden}
#gas .bar i,#peg .bar i{display:block;height:100%;width:0;background:linear-gradient(#a6b7ff,#4a63d8);transition:width .08s}
#gas.max .bar i{background:linear-gradient(#ffae6b,#e01e2f)}
#peg .bar i{background:linear-gradient(#ffe89b,#e8b21f)}
#peg.broke{color:#c81e3a}
#peg.broke .bar i{background:linear-gradient(#ff8e8e,#c81e3a)}
.hpbar.books i{background:linear-gradient(#c9a4ff,#7a3fb3)!important}
#combo{position:absolute;right:12px;top:10px;z-index:6;font-size:27px;color:#12e39a;
  -webkit-text-stroke:5px #241a4d;paint-order:stroke fill;opacity:0;transition:opacity .2s}
#combo.on{opacity:1}
#shieldfx{position:absolute;width:240px;height:240px;margin:-120px 0 0 -120px;z-index:6;border-radius:50%;
  border:5px solid #ff3b4e;background:radial-gradient(closest-side,#ff3b4e26,#ffffff18);
  box-shadow:0 0 30px #ff3b4e66;animation:shhum 1.4s infinite;pointer-events:none;will-change:transform}
@keyframes shhum{50%{opacity:.68}}
#shieldfx b{position:absolute;left:50%;bottom:-24px;transform:translateX(-50%);font-family:system-ui;font-weight:800;
  font-size:9px;letter-spacing:2px;color:#fff;text-shadow:0 2px 0 #241a4d}
/* Dogecoin: freshly minted coins drift in and heal him unless you smash them */
.coin{position:absolute;z-index:6;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;
  display:grid;place-items:center;font-size:30px;color:#5c4a09;font-family:'Comic Sans MS',system-ui,sans-serif;
  font-weight:800;background:radial-gradient(circle at 36% 30%,#ffe680,#c2a633 70%);border:4px solid #241a4d;
  box-shadow:0 5px 0 #00000033;animation:coinbob .6s infinite alternate ease-in-out;touch-action:manipulation}
@keyframes coinbob{to{transform:translateY(-12px) rotate(9deg)}}
.coin.pop{animation:coinpop .3s forwards}
@keyframes coinpop{100%{transform:scale(1.9) rotate(40deg);opacity:0}}
.heal{position:absolute;font-size:28px;color:#7ef29a;-webkit-text-stroke:5px #241a4d;paint-order:stroke fill;
  animation:dmg .7s forwards}

/* ============ WEAPONS ============ */
footer{position:relative;z-index:5;display:flex;gap:8px;padding:9px 12px calc(11px + env(safe-area-inset-bottom));
  overflow-x:auto;scrollbar-width:none}
footer::-webkit-scrollbar{display:none}
footer.locked .wp{opacity:.55}
.wp{position:relative;flex:0 0 84px;border:4px solid #241a4d;border-radius:16px;padding:7px 3px;text-align:center;
  background:linear-gradient(#ffffff,#dfe6ff);color:#241a4d;overflow:hidden;box-shadow:0 5px 0 #241a4d55;transition:transform .07s}
.wp:active{transform:translateY(4px);box-shadow:0 1px 0 #241a4d55}
.wp .i{font-size:25px;line-height:1}
.wp .n{font-family:system-ui;font-weight:800;font-size:7.5px;letter-spacing:.5px;margin-top:3px}
.wp .d{font-size:8px;color:#f0a70b;letter-spacing:1px}
.wp.on{background:linear-gradient(#fff6c9,#ffd75e)}
.wp .cd{position:absolute;inset:auto 0 0 0;height:100%;background:#241a4dcc;transform-origin:bottom;pointer-events:none}

/* ============ REKT ============ */
#rekt{position:absolute;inset:0;z-index:9;display:none;place-content:center;justify-items:center;gap:3px;
  background:radial-gradient(60% 50% at 50% 42%,#ffd75eee,#ff8a00e6 40%,#c81e3af2)}
#rekt.on{display:grid}
#rekt::before{content:'';position:absolute;inset:0;opacity:.4;
  background:repeating-conic-gradient(from 0deg at 50% 44%,#fff8 0deg 6deg,transparent 6deg 18deg);animation:spin 20s linear infinite}
#rekt>*{position:relative}
#rekt .warn{font-family:system-ui;font-weight:800;font-size:10px;letter-spacing:5px;color:#fff;text-shadow:0 2px 0 #241a4d}
#rekt .zero{font-size:22px;letter-spacing:3px;color:#fff;-webkit-text-stroke:4px #241a4d;paint-order:stroke fill}
#rekt .big{font-size:104px;line-height:.9;color:#ff3b4e;-webkit-text-stroke:9px #241a4d;paint-order:stroke fill;
  transform:skewX(-7deg);filter:drop-shadow(0 8px 0 #241a4d);animation:rektin .5s cubic-bezier(.2,1.7,.4,1)}
@keyframes rektin{0%{transform:skewX(-7deg) scale(2.6);opacity:0}60%{transform:skewX(-7deg) scale(.92)}}
#rekt .sub{font-family:system-ui;font-weight:800;font-size:11px;letter-spacing:4px;color:#fff;text-shadow:0 2px 0 #241a4d;margin-bottom:24px}
#rekt .row{display:flex;gap:11px}
#rekt .row button{border:4px solid #241a4d;border-radius:15px;padding:12px 20px;font-size:18px;letter-spacing:1px;
  background:#fff;color:#241a4d;box-shadow:0 6px 0 #241a4d}
#rekt .row button:active{transform:translateY(5px);box-shadow:0 1px 0 #241a4d}
#rekt .row button.pri{background:#12e39a}
</style>
</head>
<body>
<div id="app">

  <section id="select">
    <div class="room" id="room1"></div>
    <div id="topbar"><button class="icobtn" id="lang2">한</button><button class="icobtn" id="sound2">🔊</button></div>
    <button id="shopbtn">🛒 <b>0</b></button>
    <div id="shop"><div class="panel">
      <h3 id="shoptitle">SHOP</h3>
      <div class="bal">🪙 <b id="shopbal">0</b></div>
      <div id="shoplist"></div>
      <button class="close" id="shopclose">CLOSE</button>
    </div></div>
    <div class="wrap">
      <div class="logo">REKT</div>
      <div class="tag" id="tagline">BEAT THE CRYPTO BOSSES</div>
      <div class="stagebar" id="stagebar"></div>
      <div class="roster" id="roster"></div>
      <div class="hint" id="hintline">PICK A BOSS · CHASE · HIT</div>
    </div>
  </section>

  <section id="game" hidden>
    <div class="room" id="room2"></div>
    <header>
      <button class="icobtn" id="back">‹</button>
      <div class="hud">
        <div class="bossline"><b id="bname">—</b><span id="bcoin"></span><em id="bmech"></em></div>
        <div class="hpbar" id="hpbar"><i id="hpfill"></i></div>
      </div>
      <button class="icobtn" id="lang">한</button>
      <button class="icobtn" id="sound">🔊</button>
    </header>
    <div id="arena">
      <div id="gas" hidden><span>GAS</span><div class="bar"><i></i></div></div>
      <div id="peg" hidden><span>PEG</span> <b>$1.00</b><div class="bar"><i></i></div></div>
      <div id="combo"></div>
      <div id="purse">🪙 0</div>
      <div id="mess"></div>
      <div id="props"></div>
      <div id="aim"></div>
      <div id="stage"></div>
      <div id="fx"></div>
      <div id="callout"><b></b><span></span></div>
      <div id="flash"></div>
      <div id="cinema"><i class="bar t"></i><i class="bar b"></i><div class="veil"></div>
        <div class="card"><b class="ct"></b><span class="cs"></span></div></div>
    </div>
    <footer id="weapons"></footer>
    <div id="rekt">
      <div class="warn">LIQUIDATION WARNING</div>
      <div class="zero">HP 0%</div>
      <div class="big">REKT!</div>
      <div class="sub" id="subline">BOSS DEFEATED</div>
      <div class="row">
        <button id="again">TRY AGAIN</button>
        <button id="next" class="pri">NEXT BOSS</button>
      </div>
    </div>
  </section>
</div>

<script>
'use strict'
const $ = s => document.querySelector(s)
const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e }

/* ================= BOSS VOICES =================
   Browser-native speech synthesis: no library, no audio files. Each boss gets its
   own pitch/rate and a different system voice, so they sound like different people.
   Falls back to the synth blips when a device exposes no voices. */
const TTS = {
  ghost:      { p:.42, r:.80, v:0 },   architect:   { p:1.55, r:1.12, v:1 },
  speedrunner:{ p:.95, r:1.50, v:2 },  memelord:    { p:1.90, r:1.16, v:3 },
  showman:    { p:1.25, r:1.30, v:4 }, algorithm:   { p:1.00, r:.95,  v:5 },
  altruist:   { p:1.42, r:1.42, v:6 }, rug:         { p:.68,  r:.88,  v:7 },
}
const Voice = {
  ok: typeof speechSynthesis !== 'undefined', list: [],
  init() {
    if (!this.ok) return
    const load = () => { this.list = speechSynthesis.getVoices() }
    load(); speechSynthesis.addEventListener('voiceschanged', load)
  },
  // English exposes dozens of voices, many of them network-only (silent offline) or
  // novelty instruments. Picking blindly by index is why EN went quiet while KO —
  // which has one or two local voices — always worked.
  pickVoice(tag, i) {
    const all = this.list.filter(v => v.lang.toLowerCase().startsWith(tag))
    if (!all.length) return null
    let pool = all.filter(v => !Voice.NOVELTY.test(v.name))
    const local = pool.filter(v => v.localService)     // offline-safe voices first
    if (local.length) pool = local
    if (!pool.length) pool = all
    const seen = new Set(), out = []
    for (const v of pool) if (!seen.has(v.name)) { seen.add(v.name), out.push(v) }
    return out[i % out.length]
  },
  NOVELTY: /bells|cellos|organ|zarvox|trinoids|boing|bubbles|bahh|jester|superstar|wobble|whisper|bad news|good news|deranged|hysterical|albert|junior|ralph|fred|kathy|princess|bruce|agnes|victoria|grandma|grandpa|rocko|shelley|sandy|flo|eddy|reed/i,
  blip(text) { Sound.voice(G.boss.voice, clamp(Math.round(text.length / 4), 2, 6)) },
  say(text) {
    if (!Sound.on || !G.boss) return
    const cfg = TTS[G.boss.id] || { p:1, r:1, v:0 }
    if (!this.ok || !this.list.length) { this.blip(text); return }

    const u = new SpeechSynthesisUtterance(text)
    u.lang = ko() ? 'ko-KR' : 'en-US'
    const v = this.pickVoice(ko() ? 'ko' : 'en', cfg.v)
    if (v) u.voice = v
    u.pitch = cfg.p; u.rate = cfg.r; u.volume = .95

    // if the engine never actually starts (missing/network voice), fall back to blips
    // so a line is always audible in both languages
    let started = false, fell = false
    const fallback = () => { if (!started && !fell) { fell = true; this.blip(text) } }
    u.onstart = () => { started = true }
    u.onerror = fallback
    setTimeout(fallback, 400)

    // Chrome drops an utterance spoken in the same tick as cancel(), so only cancel
    // when something is actually running, and give it a beat
    if (speechSynthesis.speaking || speechSynthesis.pending) {
      speechSynthesis.cancel()
      setTimeout(() => speechSynthesis.speak(u), 60)
    } else speechSynthesis.speak(u)
  },
  stop() { if (this.ok) speechSynthesis.cancel() },
}
Voice.init()
